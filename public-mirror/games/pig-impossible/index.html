<!doctype html><html lang="ja"><head><base href="https://pig-impossible.vercel.app/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>PIG IMPOSSIBLE</title><style>*{box-sizing:border-box}body{margin:0;background:#12162c;color:white;font-family:system-ui;text-align:center}main{max-width:760px;margin:auto;padding:8px}h1{font-size:24px;margin:6px}#game{display:block;width:100%;aspect-ratio:720/420;background:#8ad8ff;border-radius:18px;touch-action:none}#hud{display:flex;justify-content:space-around;background:#293456;border-radius:12px;padding:10px;font-size:14px}button{border:0;border-radius:14px;padding:14px;background:#ffcf62;color:#292039;font-weight:900;font-size:16px;touch-action:manipulation}#fire{width:100%;background:#ff86af;font-size:22px;margin:8px 0}#shop{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}#shop button{font-size:12px;background:#9ae7cb}#message{min-height:36px;margin:8px}small{color:#c9d3ed}a{color:#afc9ff}</style></head><body><main><h1>🐷💥 PIG IMPOSSIBLE</h1><div id="hud"><span>📏 <b id="meters">0</b>m</span><span>🪙 <b id="coins">0</b></span><span>🏆 <b id="best">0</b>m</span><span>🧬 <b id="form">子豚</b></span></div><canvas id="game" width="720" height="420"></canvas><div id="message">発射ボタン長押しでパワーをため、離して発射！</div><button id="fire">🚀 長押しして発射！</button><div id="shop"><button data-up="power">💥 発射力 <span></span></button><button data-up="wing">🪽 空中操作 <span></span></button><button data-up="armor">🛡️ 衝突耐性 <span></span></button></div><p><small>飛行中は画面長押しで羽ばたく。🌀竜巻・🟣バネ・⚡雷・🔥炎で突然変異！</small></p><a href="https://game-bank-100.vercel.app/">GAME BANKへ戻る</a></main><script>
(function(){'use strict';const c=document.getElementById('game'),g=c.getContext('2d'),$=id=>document.getElementById(id),names=['子豚','火炎豚','雷豚','翼豚','サイボーグ豚','宇宙豚'],icons=['🐷','🔥🐷','⚡🐷','🪽🐷','🤖','🚀🐷'];let coins=0,best=0,lv={power:0,wing:0,armor:0};try{const s=JSON.parse(localStorage.getItem('pig-impossible-v1')||'{}');coins=s.coins||0;best=s.best||0;lv={...lv,...s.lv}}catch(e){}let state='ready',charge=0,charging=false,hold=false,p={x:80,y:320,vx:0,vy:0},camera=0,meters=0,earned=0,form=0,frame=0,items=[],particles=[];function save(){try{localStorage.setItem('pig-impossible-v1',JSON.stringify({coins,best,lv}))}catch(e){}}function hud(){ $('meters').textContent=meters;$('coins').textContent=coins;$('best').textContent=best;$('form').textContent=names[form];for(const k in lv)document.querySelector('[data-up="'+k+'"] span').textContent='Lv'+lv[k]+' '+(40+lv[k]*35)+'🪙'}function build(){items=[];for(let i=0;i<240;i++){const type=i%19===0?'storm':i%13===0?'fire':i%11===0?'electric':i%7===0?'spring':i%5===0?'wall':'coin';items.push({x:370+i*94,y:95+(i*71%225),type,used:false})}}function prepare(){state='charge';charge=0;charging=true;frame=0;meters=0;earned=0;form=0;camera=0;p={x:80,y:320,vx:0,vy:0};particles=[];build();$('message').textContent='💥 パワーMAXを狙って離せ！';$('fire').textContent='⚡ 離して発射！';hud()}function launch(){if(state!=='charge')return;state='flight';charging=false;p.vx=6+charge*.095+lv.power*.8;p.vy=-7-charge*.12-lv.power*.5;$('fire').textContent='✈️ 飛行中！';$('message').textContent='長押しで羽ばたけ！事故で進化！'}function finish(){if(state!=='flight')return;state='ready';coins+=earned+Math.floor(meters/25);best=Math.max(best,meters);save();hud();$('fire').textContent='🚀 もう一回飛ばす！';$('message').textContent='🏁 '+meters+'m！ +'+(earned+Math.floor(meters/25))+'🪙　強化して再挑戦！'}function evolve(type){if(type==='fire')form=1;else if(type==='electric')form=2;else if(type==='storm')form=3;else if(type==='wall'&&form>=3)form=4;else if(meters>1800)form=5;$('message').textContent='🧬 '+names[form]+' に突然変異！'}function update(){frame++;if(state==='charge'){charge=(Math.sin(frame*.055-Math.PI/2)+1)*50;return}if(state!=='flight')return;const gravity=form===3?.13:.24;if(hold)p.vy-=.34+lv.wing*.06;p.vy=Math.min(12,p.vy+gravity);p.x+=p.vx;p.y+=p.vy;p.vx*=.9992;camera=Math.max(0,p.x-150);meters=Math.max(meters,Math.floor(p.x/8));if(meters>1800&&form!==5)form=5;for(const o of items){if(o.used||Math.abs(o.x-p.x)>42||Math.abs(o.y-p.y)>44)continue;o.used=true;if(o.type==='coin')earned+=10;else if(o.type==='spring'){p.vy=-12;p.vx+=2;$('message').textContent='🟣 超反発！'}else if(o.type==='storm'){p.vy=-14;p.vx+=2;evolve('storm')}else if(o.type==='fire'){p.vx+=3;evolve('fire')}else if(o.type==='electric'){p.vx+=2;p.vy-=6;evolve('electric')}else{p.vx=Math.max(2,p.vx-(2-lv.armor*.2));p.vy=-6;evolve('wall')}for(let j=0;j<8;j++)particles.push({x:p.x,y:p.y,vx:(Math.random()-.5)*9,vy:(Math.random()-.5)*9,life:22})}for(const q of particles){q.x+=q.vx;q.y+=q.vy;q.life--}particles=particles.filter(q=>q.life>0);if(p.y<32){p.y=32;p.vy=2}if(p.y>=362){p.y=362;finish()}if(frame>5000)finish();hud()}function draw(){let grad=g.createLinearGradient(0,0,0,420);grad.addColorStop(0,form===5?'#33366e':'#73c7ff');grad.addColorStop(1,'#fce8b2');g.fillStyle=grad;g.fillRect(0,0,720,420);g.fillStyle='#ffffff99';for(let i=0;i<12;i++){const x=((i*171-camera*.25)%950+950)%950-100;g.beginPath();g.ellipse(x,55+i*31%220,45,15,0,0,7);g.fill()}g.fillStyle='#6bc369';g.fillRect(0,377,720,43);g.fillStyle='#a4dc77';g.fillRect(0,362,720,15);for(const o of items){if(o.used)continue;const x=o.x-camera;if(x< -50||x>760)continue;g.font='35px serif';g.fillText(({coin:'🪙',spring:'🟣',storm:'🌀',fire:'🔥',electric:'⚡',wall:'🧱'})[o.type],x-18,o.y+10)}for(const q of particles){g.globalAlpha=q.life/22;g.fillStyle='#fff4a1';g.beginPath();g.arc(q.x-camera,q.y,4,0,7);g.fill()}g.globalAlpha=1;g.font='56px serif';g.fillText(icons[form],p.x-camera-30,p.y+15);if(state==='charge'){g.fillStyle='#14203dbb';g.fillRect(0,0,720,420);g.textAlign='center';g.fillStyle='white';g.font='bold 28px system-ui';g.fillText('⚡ 発射パワーを決めろ！',360,150);g.fillStyle='white';g.fillRect(135,180,450,30);g.fillStyle=charge>85?'#43f0a8':'#ffcc55';g.fillRect(135,180,450*charge/100,30);g.fillStyle='white';g.fillText(Math.floor(charge)+'%',360,250);g.textAlign='left'}if(state==='ready'){g.fillStyle='#14203d99';g.fillRect(0,0,720,420);g.fillStyle='white';g.textAlign='center';g.font='bold 30px system-ui';g.fillText('🐷 豚、地球を脱出せよ！',360,176);g.font='19px system-ui';g.fillText('事故で進化！飛んで強くなれ！',360,215);g.textAlign='left'}}function loop(){update();draw();requestAnimationFrame(loop)}const fire=$('fire');fire.addEventListener('pointerdown',e=>{if(state==='ready'){prepare();fire.setPointerCapture(e.pointerId)}});fire.addEventListener('pointerup',()=>{if(state==='charge')launch()});fire.addEventListener('click',()=>{if(state==='ready'){prepare();setTimeout(()=>{if(state==='charge')launch()},1100)}});c.addEventListener('pointerdown',e=>{if(state==='flight'){hold=true;c.setPointerCapture(e.pointerId)}});c.addEventListener('pointerup',()=>hold=false);c.addEventListener('pointercancel',()=>hold=false);window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(state==='ready')prepare();else if(state==='flight')hold=true}});window.addEventListener('keyup',e=>{if(e.code==='Space'){if(state==='charge')launch();hold=false}});document.querySelectorAll('[data-up]').forEach(b=>b.addEventListener('click',()=>{if(state!=='ready')return;const k=b.dataset.up,cost=40+lv[k]*35;if(coins<cost){$('message').textContent='あと'+(cost-coins)+'🪙必要！';return}coins-=cost;lv[k]++;save();hud()}));hud();loop()})();
</script><script defer src="https://game-bank-100.vercel.app/assets/play-track.js" data-game-map='{"":"140"}'></script></body></html>
