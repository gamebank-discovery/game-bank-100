=score;$("best").textContent=best;$("hp").textContent="♥".repeat(Math.max(0,hp));$("level").textContent=level}function award(n){score+=n;if(score>best){best=score;try{localStorage.setItem("gb-full-"+ID,String(best))}catch{}}ui()}function hurt(){hp--;sound(160);if(hp<=0)end(false);ui()}function end(win){if(mode!=="play")return;mode="over";ov.innerHTML='<div><div style="font-size:66px">'+(win?"🏆":"💥")+'</div><h2>'+(win?"CLEAR!":"GAME OVER")+'</h2><p>SCORE '+score+' · BEST '+best+'</p><button>↻ RETRY</button></div>';ov.classList.remove("hide")}function start(){mode="play";score=0;hp=3;level=1;time=0;reset();ov.classList.add("hide");ui()}function loop(ms){let dt=Math.min(.05,(ms-last)/1000||0);last=ms;if(mode==="play"){time+=dt;update(dt)}draw();requestAnimationFrame(loop)}ov.addEventListener("click",e=>{if(e.target.closest("button"))start()});let x=210,y=450,size=28,fish=[],spawn=0,tx=210,ty=450,inv=0;function reset(){x=210;y=450;tx=x;ty=y;size=28;fish=[];spawn=.4;inv=0}function update(dt){x+=(tx-x)*Math.min(1,dt*8);y+=(ty-y)*Math.min(1,dt*8);inv=Math.max(0,inv-dt);spawn-=dt;if(spawn<=0){let big=Math.random()<.24;fish.push({x:Math.random()<.5?-45:465,y:70+Math.random()*450,dx:0,dy:0,big,r:big?Math.min(63,size+17):Math.max(12,size-10),speed:big?110:145});fish[fish.length-1].dx=fish[fish.length-1].x<0?1:-1;spawn=Math.max(.28,.78-level*.05)}for(let f of fish){f.x+=f.dx*f.speed*dt;let dist=Math.hypot(f.x-x,f.y-y);if(dist<size*.7+f.r*.6){if(f.r<size&&(!f.big||size>f.r)){award(110+Math.floor(size));size=Math.min(75,size+1.8);f.dead=true;sound(800)}else if(inv<=0){inv=1;hurt();f.dead=true}}}fish=fish.filter(f=>!f.dead&&f.x>-90&&f.x<510);if(score>=level*900){level++;hp=Math.min(5,hp+1);sound(1050)}if(level>=6)end(true)}function draw(){const g=c.createLinearGradient(0,0,0,620);g.addColorStop(0,"#067eaa");g.addColorStop(1,"#021b43");c.fillStyle=g;c.fillRect(0,0,420,620);for(let i=0;i<20;i++){c.fillStyle="#a8faff22";c.beginPath();c.arc((i*83+time*12)%420,(i*137+time*22)%620,3+i%4
