<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ビートビースト | GAME BANK</title><style>*{box-sizing:border-box}body{margin:0;background:#0b152a;color:#f2f8ff;font-family:system-ui}main{max-width:540px;margin:auto;padding:14px}a{color:#cfffad}h1{font-size:36px;margin:14px 0}p{font-size:13px;color:#c2d5e8}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}.hud div{background:#213b58;border-radius:11px;padding:9px 2px;text-align:center}.hud small{display:block;font-size:10px;color:#b7cbd9}.hud b{font-size:19px}.board{position:relative;border:2px solid #739abb;border-radius:13px;overflow:hidden;touch-action:none}canvas{width:100%;aspect-ratio:420/620;display:block;touch-action:none}.overlay{position:absolute;inset:0;background:#08172eeb;display:grid;place-items:center;text-align:center;padding:22px}.hide{display:none}.overlay button{background:#d4ffa9;color:#173729;border:0;border-radius:12px;padding:15px 28px;font-size:16px;font-weight:900}.buttons{display:flex;gap:7px;margin:9px 0}.buttons button{flex:1;border:1px solid #7496b5;border-radius:11px;background:#2d4c6b;color:#fff;padding:14px 3px;font-size:13px;font-weight:800;touch-action:manipulation}</style><link rel="stylesheet" href="/assets/mobile-fit.css"></head><body><main><a href="/">← GAME BANK</a><h1>🎵 ビートビースト</h1><p>4レーンのビートを叩き、コンボを伸ばして3ステージを攻略</p><div class="hud"><div><small>SCORE</small><b id="score">0</b></div><div><small>BEST</small><b id="best">0</b></div><div><small>HP</small><b id="hp">5</b></div><div><small>STAGE</small><b id="stage">1</b></div></div><div class="board"><canvas id="cv" width="420" height="620"></canvas><div class="overlay" id="overlay"><div><div style="font-size:68px">🎵</div><h2>ビートビースト</h2><p>4レーンのビートを叩き、コンボを伸ばして3ステージを攻略</p><button>▶ START</button></div></div></div><div class="buttons"><button id="b0">D</button><button id="b1">F</button><button id="b2">J</button><button id="b3">K</button></div><div class="buttons"><button id="pause">⏸ 一時停止</button><button id="mute">🔊 音あり</button><button id="restart">↻ 最初から</button></div></main><script>const ID=1;(()=>{"use strict";const $=id=>document.getElementById(id),cv=$("cv"),c=cv.getContext("2d"),overlay=$("overlay");let running=false,paused=false,mute=false,score=0,best=0,hp=5,stage=1,t=0,last=0,audio;try{best=+localStorage.getItem("gb-v2-"+ID)||0}catch{}function tone(f){if(mute)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain(),n=audio.currentTime;o.frequency.value=f;g.gain.setValueAtTime(.05,n);g.gain.exponentialRampToValueAtTime(.001,n+.12);o.connect(g);g.connect(audio.destination);o.start(n);o.stop(n+.13)}catch{}}function ui(){$("score").textContent=score;$("best").textContent=best;$("hp").textContent=hp;$("stage").textContent=stage;$("pause").textContent=paused?"▶ 再開":"⏸ 一時停止";$("mute").textContent=mute?"🔇 消音":"🔊 音あり"}function gain(n){score+=n;if(score>best){best=score;try{localStorage.setItem("gb-v2-"+ID,String(best))}catch{}}ui()}function hurt(){hp--;tone(155);if(hp<=0)finish(false);ui()}function finish(win){running=false;overlay.innerHTML='<div><h2>'+(win?"🏆 CLEAR":"💥 GAME OVER")+'</h2><p>SCORE '+score+' / BEST '+best+'</p><button>↻ RETRY</button></div>';overlay.classList.remove("hide")}function start(){running=true;paused=false;score=0;hp=5;stage=1;t=0;reset();overlay.classList.add("hide");ui()}function loop(ms){let dt=Math.min(.05,(ms-last)/1000||0);last=ms;if(running&&!paused){t+=dt;update(dt)}draw();requestAnimationFrame(loop)}overlay.addEventListener("click",e=>{if(e.target.closest("button"))start()});$("pause").onclick=()=>{if(running){paused=!paused;ui()}};$("mute").onclick=()=>{mute=!mute;ui()};$("restart").onclick=start;document.addEventListener("visibilitychange",()=>{if(document.hidden&&running){paused=true;ui()}});let notes=[],spawn=0,combo=0,miss=0;function reset(){notes=[];spawn=.3;combo=0;miss=0}function update(dt){spawn-=dt;if(spawn<=0){notes.push({lane:Math.floor(Math.random()*4),y:-30,hit:false});spawn=Math.max(.4,.72-stage*.08)}for(const n of notes){n.y+=245*dt;if(n.y>570&&!n.hit){n.hit=true;miss++;combo=0;if(miss%3===0)hurt()}}notes=notes.filter(n=>!n.hit&&n.y<650);if(score>=stage*1800){stage++;hp=Math.min(5,hp+1);ui()}if(stage>3)finish(true)}function action(i){if(!running||paused)return;let n=notes.filter(x=>x.lane===i).sort((a,b)=>Math.abs(a.y-500)-Math.abs(b.y-500))[0];if(n&&Math.abs(n.y-500)<78){n.hit=true;combo++;gain(100+Math.min(25,combo)*8);tone([262,330,392,523][i])}else{combo=0;miss++;if(miss%3===0)hurt()}}function draw(){c.fillStyle="#261d4c";c.fillRect(0,0,420,620);for(let i=0;i<4;i++){c.fillStyle=i%2?"#393164":"#283d68";c.fillRect(i*105,0,105,620);c.strokeStyle="#789ac5";c.strokeRect(i*105,0,105,620)}c.fillStyle="#c9ffb555";c.fillRect(0,475,420,60);c.fillStyle="white";c.textAlign="center";c.font="bold 21px system-ui";c.fillText("COMBO "+combo+" · MISS "+miss,210,46);for(const n of notes){c.font="40px system-ui";c.fillText("🎵",n.lane*105+52,n.y)}c.font="14px system-ui";c.fillText("D · F · J · K",210,605)}for(let i=0;i<4;i++)$("b"+i).addEventListener("pointerdown",e=>{e.preventDefault();action(i)});cv.addEventListener("pointerdown",e=>{e.preventDefault();let r=cv.getBoundingClientRect();action(Math.min(3,Math.max(0,Math.floor((e.clientX-r.left)/r.width*4))))});window.addEventListener("keydown",e=>{let i=["d","f","j","k"].indexOf(e.key.toLowerCase());if(i>=0&&!e.repeat)action(i)});ui();requestAnimationFrame(loop)})();</script><script src="/assets/mobile-fit.js" defer></script><script src="/assets/audio-v3.js" defer></script><script defer src="/assets/play-track.js" data-game-map='{"":"1"}'></script></body></html><script async data-explicit-opt-in="true" data-deployment-id="dpl_6ZiQNpeQpCs2iqdKbuWVm7ujAcYx" src="https://vercel.live/_next-live/feedback/feedback.js"></script><script async data-explicit-opt-in="true" data-deployment-id="dpl_xw
