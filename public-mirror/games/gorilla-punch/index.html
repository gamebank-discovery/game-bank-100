'use strict';const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d');let mode='penguin',state='menu',score=0,left=60,elapsed=0,combo=0,best=0,muted=true,audio,objects=[],particles=[],y=430,vy=0,jumps=0,spawn=0,hit=0,marker=0,rock=0,flash=0,text='',last=0;const rand=(a,b)=>a+Math.random()*(b-a);function readBest(){try{return Number(localStorage.getItem('animal-'+mode))||0}catch{return 0}}function toggleSound(){muted=!muted;$('sound').textContent=muted?'音 OFF':'音 ON';if(!muted)beep(440)}function beep(f=500){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=f;g.gain.setValueAtTime(.06,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);o.start();o.stop(audio.currentTime+.13)}catch{}}
