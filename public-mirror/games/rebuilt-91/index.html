<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>深海探検隊</title><style>*{box-sizing:border-box}body{background:#0b1930;color:white;font-family:system-ui;margin:0}main{max-width:520px;margin:auto;padding:14px}a{color:#c8ffa9}p{color:#b7cde4}.hud,.buttons{display:flex;gap:6px;justify-content:space-between;margin:12px 0}.hud span{background:#213a57;padding:10px 4px;border-radius:8px;flex:1;text-align:center;font-size:12px}button{flex:1;background:#315579;border:1px solid #85a4c5;color:white;border-radius:10px;padding:15px 3px;font-weight:bold;touch-action:manipulation}.board{position:relative}canvas{width:100%;aspect-ratio:420/620;touch-action:none;border:2px solid #789abc;border-radius:12px}.overlay{position:absolute;inset:0;background:#091a31e8;display:grid;place-items:center;text-align:center}.hide{display:none}</style><link rel="stylesheet" href="/assets/mobile-fit.css"></head><body><main><a href="/">← GAME BANK</a><h1>🐠 深海探検隊</h1><p>迷路の出口を目指すパズルゲーム</p><div class="hud"><span>SCORE <b id="score">0</b></span><span>BEST <b id="best">0</b></span><span>HP <b id="hp">5</b></span><span>LEVEL <b id="level">1</b></span></div><div class="board"><canvas id="cv" width="420" height="620"></canvas><div id="overlay" class="overlay"><div><h2>深海探検隊</h2><p>迷路の出口を目指すパズルゲーム</p><button id="start">▶ START</button></div></div></div><div class="buttons"><button id="a">◀ / 1</button><button id="b">▶ / 2</button><button id="d">⚡ / 3</button><button id="e">4</button></div><div class="buttons"><button id="pause">⏸ 一時停止</button><button id="mute">🔊 音</button><button id="retry">↻ 最初から</button></div></main><script>(()=>{'use strict';const ID=91,TITLE="深海探検隊",$=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),ov=$('overlay');let active=false,paused=false,score=0,best=0,hp=5,level=1,turn=0,answer=0,position=0,grid=[],question='',choices=[],last=0;try{best=+localStorage.getItem('gb-v3-'+ID)||0}catch{}function ui(){$('score').textContent=score;$('best').textContent=best;$('hp').textContent=hp;$('level').textContent=level;$('pause').textContent=paused?'▶ 再開':'⏸ 一時停止'}function gain(n){score+=n;if(score>best){best=score;try{localStorage.setItem('gb-v3-'+ID,String(best))}catch{}}ui()}function beep(f){try{window.GBQuality?.play(f)}catch{}}function fail(){hp--;beep(180);if(hp<=0)end(false);ui()}function end(win){active=false;ov.classList.remove('hide');ov.innerHTML='<div><h2>'+(win?'🏆 CLEAR!':'💥 GAME OVER')+'</h2><p>SCORE '+score+' / BEST '+best+'</p><button id="start">↻ RETRY</button></div>'}function start(){active=true;paused=false;score=0;hp=5;level=1;turn=0;position=0;setup();ov.classList.add('hide');ui()}function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}function text(s,x,y,size=20){ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold '+size+'px system-ui';ctx.fillText(s,x,y)}function frame(){ctx.fillStyle='#182d47';ctx.fillRect(0,0,420,620);if(active)draw();else{text(TITLE,210,210,28);text('▶ START',210,300,25)}requestAnimationFrame(frame)}function input(i){if(!active||paused)return;action(i)}ov.addEventListener('click',e=>{if(e.target.closest('button'))start()});['a','b','d','e'].forEach((k,i)=>$(k).addEventListener('pointerdown',e=>{e.preventDefault();input(i)}));$('retry').onclick=start;$('pause').onclick=()=>{if(active){paused=!paused;ui()}};$('mute').onclick=()=>{let b=$('gb-qa-audio');if(b)b.click()};cv.addEventListener('pointerdown',e=>{if(!active||paused)return;let r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*420,y=(e.clientY-r.top)/r.height*620;canvasInput(x,y)});window.addEventListener('keydown',e=>{if(e.repeat)return;let keys=['1','2','3','4'];let i=keys.indexOf(e.key);if(i>=0)input(i);if(e.key==='ArrowUp')input(0);if(e.key==='ArrowDown')input(1);if(e.key==='ArrowLeft')input(2);if(e.key==='ArrowRight')input(3)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&active){paused=true;ui()}});let walls=new Set(),steps=0;function reachable(w){let q=[0],seen=new Set([0]);while(q.length){let v=q.shift();if(v===24)return true;for(let d of [-5,5,-1,1]){let n=v+d;if(n<0||n>=25||(d===-1&&v%5===0)||(d===1&&v%5===4)||w.has(n)||seen.has(n))continue;seen.add(n);q.push(n)}}return false}function setup(){position=0;steps=0;for(let tries=0;tries<30;tries++){let w=new Set();for(let i=1;i<24;i++)if(Math.random()<Math.min(.24,.12+level*.02))w.add(i);if(reachable(w)){walls=w;return}}walls=new Set()}function action(i){let d=[-5,5,-1,1][i],next=position+d;if(next<0||next>=25||(d===-1&&position%5===0)||(d===1&&position%5===4)||walls.has(next)){beep(190);return}position=next;steps++;beep(520);if(position===24){gain(Math.max(100,600-steps*10));level++;hp=Math.min(5,hp+1);if(level>5){end(true);return}setup();ui()}}function canvasInput(x,y){if(y<160||y>560)return;let col=Math.floor((x-30)/72),row=Math.floor((y-175)/72);if(col<0||col>4||row<0||row>4)return;let target=row*5+col,diff=target-position;let i=[-5,5,-1,1].indexOf(diff);if(i>=0)input(i)}function draw(){text('🧩 '+TITLE,210,85,26);text('🚪 出口を目指そう',210,135,19);for(let i=0;i<25;i++){let x=30+(i%5)*72,y=175+Math.floor(i/5)*72;rect(x,y,66,66,walls.has(i)?'#162334':'#42627b');text(i===position?'🧑':i===24?'🚪':walls.has(i)?'🧱':'',x+33,y+44,28)}text('移動 '+steps+' 手 | ↑ ↓ ← →',210,590,17)}ui();requestAnimationFrame(frame)})();</script><script src="/assets/mobile-fit.js" defer></script><script src="/assets/audio-v3.js" defer></script><script defer src="/assets/play-track.js" data-game-map='{"":"91"}'></script></body></html><script async data-explicit-opt-in="true" data-deployment-id="dpl_6ZiQNpeQpCs2iqdKbuWVm7ujAcYx" src="https://vercel.live/_next-live/feedback/feedback.js"></script>
