 of tasks)nativeRAF(fn)}}function setMuted(v){muted=v;document.getElementById('gb-mute-btn').textContent=v?'🔇 音を戻す':'🔊 音を消す';for(const c of contexts){try{v?c.suspend():c.resume()}catch{}}}document.addEventListener('DOMContentLoaded',()=>{const host=document.createElement('div');host.className='gb-tools';host.innerHTML='<button id="gb-pause-btn" type="button">⏸ 一時停止</button><button id="gb-mute-btn" type="button">🔊 音を消す</button><button id="gb-restart-btn" type="button">↻ 最初から</button>';const target=document.querySelector('canvas')?.parentElement||document.body;target.insertAdjacentElement('afterend',host);const modal=document.createElement('div');modal.id='gb-pause-screen';modal.className='gb-pause';modal.innerHTML='<div>⏸ PAUSED<div><button id="gb-resume-btn">▶ ゲームに戻る</button></div></div>';document.body.appendChild(modal);document.getElementById('gb-pause-btn').onclick=()=>setPaused(!paused);document.getElementById('gb-resume-btn').onclick=()=>setPaused(false);document.getElementById('gb-mute-btn').onclick=()=>setMuted(!muted);document.getElementById('gb-restart-btn').onclick=()=>location.reload();window.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();setPaused(!paused)}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused)setPaused(true)});});})();</script><link rel="stylesheet" href="/assets/mobile-fit.css"></head><body><div class="wrap"><nav class="nav"><a href="/">← GAME <b>BANK</b></a><span>GAME #011 · ANIMAL ACTION</span></nav><header class="lead"><small>TAP FAST · DODGE POISON</small><h1>タコ足 <em>パニック！</em></h1><p>3×3の海底フィールドで光るタコを連打！毒には触らず、星で大得点を狙おう。</p></header><div class="hud"><div class="stat"><small>SCORE</small><b class="cyan" id="score">0</b></div><div class="stat"><small>BEST</small><b id="best">0</b></div><div class="stat"><small>LIVES</small><b id="life">♥♥♥</b></div><div class="stat"><small>TIME</small><b id="timer">60s</b></div></div><main class="scene"><div class="sea"><button class="hole" aria-labe const $=id=>document.getElementById(id),holes=[...document.querySelectorAll(".hole")],TARGET=2300,LENGTH=60,KEY="game-bank-octopus-11";
let state="menu",score=0,best=0,combo=0,maxCombo=0,life=3,time=LENGTH,fever=0,ink=0,moles=Array(9).fill(null),spawnTimer=0,last=0,sound=true,audio=null,started=0,misses=0,goodHits=0;
try{best=Number(localStorage.getItem(KEY))||0}catch{}
function beep(freq=600,dur=.1,type="sine"){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume?.();let o=audio.createOscillator(),g=audio.createGain(),n=audio.currentTime;o.type=type;o.frequency.setValueAtTime(freq,n);o.frequency.exponentialRampToValueAtTime(Math.max(90,freq*.6),n+dur);g.gain.setValueAtTime(.085,n);g.gain.exponentialRampToValueAtTime(.001,n+dur);o.connect(g);g.connect(audio.destination);o.start(n);o.stop(n+dur+.02)}catch{}}
function save(){if(score>best){best=score;try{localStorage.setItem(KEY,String(best))}catch{}}}
function hud(){$("score").textContent=score.toLocaleString();$("best").textContent=best.toLocaleString();$("life").textContent="♥".repeat(Math.max(0,life));$("timer").textContent=Math.ceil(Math.max(0,time))+"s";$("bar").style.width=(score/TARGET*100).toFixed(1).replace(/^(\d{3,})/,"100")+"%";$("fever").textContent=fever>0?"FEVER ×2 "+Math.ceil(fever)+"s":"5 HIT → FEVER"}
function notice(str){$("toast").textContent=str;$("toast").classList.add("on");setTimeout(()=>$("toast").classList.remove("on"),850)}

function render(){for(let i=0;i<9;i++){let e=moles[i],hole=holes[i];hole.className="hole"+(e?" "+e.kind:"");hole.innerHTML=e?'<span class="creature">'+({good:"🐙",bad:"☠️",bonus:"⭐"}[e.kind])+'</span>':'<span class="num">'+(i+1)+'</span>';hole.setAttribute("aria-label",e?{good:"光るタコ",bad:"毒マス",bonus:"ボーナス"}[e.kind]:"空のマス")}}

function roll(){if(state!=="playing")return false;const free=[];for(let i=0;i<9;i++)if(!moles[i])free.push(i);if(!free.length)return false;const i=free[Math.floor(Math.random()*free.length)],r=Math.random(),kind=r<.66?"good":r<.89?"bad":"bonus";moles[i]={kind,ttl:Math.max(.5,1.18-(LENGTH-time)*.009),fresh:true};render();return true}
function tap(i){if(state!=="playing"||i<0||i>=9)return;const item=moles[i];if(!item){combo=0;beep(200,.04);return}moles[i]=null;if(item.kind==="bad"){life--;combo=0;beep(145,.18,"sawtooth");notice("☠️ 毒！ LIFE -1");if(life<=0){finish(false);return}}else{combo++;maxCombo=Math.max(combo,maxCombo);goodHits++;if(item.kind==="good"){score+=Math.round((100+Math.min(combo,20)*12)*(fever>0?2:1));ink++}else{score+=500*(fever>0?2:1);ink+=2}beep(item.kind==="bonus"?1120:770,.09);if(ink>=5){fever=5;ink=0;notice("🔥 FEVER ×2！")}else if(combo%5===0)notice("COMBO "+combo+"!");save()}render();hud()}
function finish(won){if(state!=="playing")return;state=won?"won":"lost";save();render();hud();message(won?"OCTOPUS MASTER!":"GAME OVER",won?"目標クリア！":"スコア "+score.toLocaleString()+" / 目標 "+TARGET+"。ライフが尽きたか、時間切れやで。");beep(won?1000:170,.24)}
function update(dt){if(state!=="playing")return;time=Math.max(0,time-dt);spawnTimer-=dt;fever=Math.max(0,fever-dt);for(let i=0;i<9;i++){let e=moles[i];if(!e)continue;e.ttl-=dt;if(e.ttl<=0){if(e.kind==="good")misses++;moles[i]=null;combo=0}}if(spawnTimer<=0){roll();spawnTimer=Math.max(.27,.79-(LENGTH-time)*.007)}render();if(time<=0)finish(score>=TARGET);hud()}
function loop(now){const dt=Math.min(.07,Math.max(0,(now-last)/1000||0));last=now;update(dt);requestAnimationFrame(loop)}
$("overlay").addEventListener("click",e=>{if(e.target.closest("#start"))reset()});
holes.forEach((h,i)=>h.addEventListener("pointerdown",e=>{e.preventDefault();tap(i)}));
