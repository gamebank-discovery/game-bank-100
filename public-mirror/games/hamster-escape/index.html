d;border:1px solid #83a7bb;border-radius:10px;color:#f2fbff;padding:12px 8px;font:700 13px system-ui;touch-action:manipulation}.gb-tools button:focus-visible{outline:3px solid #e5ffac}.gb-pause{position:fixed;inset:0;background:#071528ec;display:none;z-index:99999;place-items:center;color:white;font:700 28px system-ui;text-align:center;padding:25px}.gb-pause.show{display:grid}.gb-pause button{background:#d4ff9d;color:#193a25;padding:15px 26px;border:0;border-radius:13px;font:800 17px system-ui;margin-top:20px}</style><script id="gb-quality-js">(()=>{'use strict';if(window.__gbQuality)return;window.__gbQuality=true;const nativeRAF=window.requestAnimationFrame.bind(window),pending=new Map();let paused=false,muted=false,next=1;window.requestAnimationFrame=function(fn){const id=next++;function run(t){if(paused){pending.set(id,run);return}pending.delete(id);fn(t)}nativeRAF(run);return id};const AC=window.AudioContext||window.webkitAudioContext;const contexts=[];if(AC){const Wrapped=function(...args){const c=new AC(...args);contexts.push(c);const resume=c.resume.bind(c);c.resume=function(){return muted?Promise.resolve():resume()};if(muted)c.suspend();return c};Wrapped.prototype=AC.prototype;try{if(window.AudioContext)window.AudioContext=Wrapped;if(window.webkitAudioContext)window.webkitAudioContext=Wrapped}catch{}}function setPaused(v){paused=v;document.getElementById('gb-pause-screen').classList.toggle('show',v);document.getElementById('gb-pause-btn').textContent=v?'▶ 再開':'⏸ 一時停止';if(!v){const tasks=[...pending.values()];pending.clear();for(const fn of tasks)nativeRAF(fn)}}function setMuted(v){muted=v;document.getElementById('gb-mute-btn').textContent=v?'🔇 音を戻す':'🔊 音を消す';for(const c of contexts){try{v?c.suspend():c.resume()}catch{}}}document.addEventListener('DOMContentLoaded',()=>{const host=document.createElement('div');host.className='gb-tools';host.innerHTML='<button id="gb-pause-btn" type="button">⏸ 一時停止</button><button id="gb-mute-btn" type="button">🔊 音を消す</button><button id="gb-restart-btn" type="button">↻ 最初から</button>';const target=document.querySelector('canvas')?.parentElement||document.body;target.insertAdjacentElement('afterend',host);const modal=document.createElement('div');modal.id='gb-pause-screen';modal.className='gb-pause';modal.innerHTML='<div>⏸ PAUSED<div><button id="gb-resume-btn">▶ ゲームに戻る</button></div></div>';document.body.appendChild(modal);document.getElementById('gb-pause-btn').onclick=()=>setPaused(!paused);document.getElementById('gb-resume-btn').onclick=()=>setPaused(false);document.getElementById('gb-mute-btn').onclick=()=>setMuted(!muted);document.getElementById('gb-restart-btn').onclick=()=>location.reload();window.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();setPaused(!paused)}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused)setPaused(true)});});})();</script><link rel="stylesheet" href="/assets/mobile-fit.css"></head><body><div class="wrap"><nav class="nav"><a href="/">← GAME <b>BANK</b></a><span>GAME #012 · MAZE ADVENTURE</span></nav><header class="head"><small>FIND CHEESE · ESCAPE THE CAT</small><h1>ハムスター <em>大脱走！</em></h1><p>13×13の迷路を毎回自動生成！チーズを3個集めてネコから逃げよう。3ステージ突破でクリア！</p></header><div class="hud"><div><small>LEVEL</small><b id="level">1/3</b></div><div><small>CHEESE</small><b id="cheese">0/3</b></div><div><small>HEALTH</small><b id="life">♥♥♥</b></div><div><small>TIME</small><b id="time">100s</b></div></div><main class="arena"><div id="maze" class="maze" aria-label="ハムスターの脱出迷路"></div><div class="overlay" id="overlay"></div><div class="toast" id="toast"></div></main><div class="dpad"><span></span><button data-dir="up">↑</button><span></span><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div><div class="legend"><span>🐹 プレイヤー</span><span>🧀 チーズ</span><span>🐈 ネコ</span><span>🚪 出口</span><span>SCORE <b id="score">0</b></span><span>BEST <b id="best">0</b></span></div><p class="footer">PC：矢印キー・WASD。スマホ：スワイプか方向ボタン。チーズを3つ集めると出口が開くで。ネコに3回捕まると終了。</p></div><script>"use strict";const $=id=>document.getElementById(id),N=13,KEY="gb-hamster-12",COUNT=3,dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
let state="menu",map=[],player={x:1,y:1},cat={x:11,y:1},cheese=[],exit={x:11,y:11},level=1,life=3,time=100,score=0,best=0,catWait=1,shield=0,last=0,touch=null,audio=null;
try{best=Number(localStorage.getItem(KEY))||0}catch{}
const pos=(x,y)=>y*N+x,eq=(a,b)=>a.x===b.x&&a.y===b.y,rand=n=>Math.floor(Math.random()*n);
function beep(f=500){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume?.();let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.15)}catch{}}
function save(){if(score>best){best=score;try{localStorage.setItem(KEY,String(best))}catch{}}}
function floor(x,y){return x>=0&&x<N&&y>=0&&y<N&&map[pos(x,y)]===0}
function adj(p){return Object.values(dirs).map(([dx,dy])=>({x:p.x+dx,y:p.y+dy})).filter(n=>floor(n.x,n.y))}
function bfs(from){let d=new Map([[pos(from.x,from.y),0]]),q=[from];for(let i=0;i<q.length;i++){let cur=q[i],n=d.get(pos(cur.x,cur.y));for(let next of adj(cur)){let k=pos(next.x,next.y);if(!d.has(k)){d.set(k,n+1);q.push(next)}}}return d}
function maze(){map=Array(N*N).fill(1);map[pos(1,1)]=0;let stack=[{x:1,y:1}];while(stack.length){let p=stack[stack.length-1],a=[[2,0],[-2,0],[0,2],[0,-2]].map(([dx,dy])=>({x:p.x+dx,y:p.y+dy,dx,dy})).filter(n=>n.x>0&&n.x<N-1&&n.y>0&&n.y<N-1&&map[pos(n.x,n.y)]===1);if(!a.length){stack.pop();continue}let n=a[rand(a.length)];map[pos(p.x+n.dx/2,p.y+n.dy/2)]=map[pos(n.x,n.y)]=0;stack.push({x:n.x,y:n.y})}
let reach=bfs({x:1,y:1});if(!reach.has(pos(11,11)))throw Error("exit unreachable");let slots=[...reach].filter(([k,d])=>d>8&&k!==pos(11,11)&&k!==pos(11,1)).map(([k])=>({x:k%N,y:Math.floor(k/N)}));cheese=[];while(cheese.length<COUNT&&slots.length)cheese.push(slots.splice(rand(slots.length),1)[0]);if(cheese.length!==COUNT)throw Error("cheese unavailable")}
function hud(){$("level").textContent=level+"/3";$("cheese").textContent=(COUNT-cheese.length)+"/3";$("life").textContent="♥".repeat(Math.max(0,life));$("time").textContent=Math.ceil(time)+"s";$("score").textContent=score.toLocaleString();$("best").textContent=best.toLocaleString()}
function toast(t){$("toast").textContent=t;$("toast").classList.add("on");setTimeout(()=>$("toast").classList.remove("on"),850)}
function render(){let cells=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++){let e=document.createElement("div"),cls=floor(x,y)?"tile":"tile wall",text="";if(floor(x,y)){if(x===11&&y===11){cls="tile exit";text=cheese.length?"🔒":"🚪"}if(cheese.some(p=>p.x===x&&p.y===y)){cls="tile cheese";text="🧀"}if(cat.x===x&&cat.y===y){cls="tile cat";text="🐈"}if(player.x===x&&player.y===y){cls="tile hero";text="🐹"}}e.className=cls;e.textContent=text;cells.push(e)}$("maze").replaceChildren(...cells)}
function overlay(title,msg){$("overlay").classList.remove("hidden");$("overlay").innerHTML='<div class="modal"><div class="icon">🐹</div><h2>'+title+'</h2><p>'+msg+'</p><button class="start" id="start">▶ START / RETRY</button></div>'}
function setup(){time=100;shield=2;catWait=1.8;player={x:1,y:1};cat={x:11,y:1};maze();render();hud();toast("LEVEL "+level)}
function start(){level=1;score=0;life=3;state="playing";$("overlay").classList.add("hidden");setup()}
function hurt(){if(shield>0)return;life--;shield=2.8;cat={x:11,y:1};beep(170);toast("🐈 CAUGHT!");if(life<=0)finish(false)}
function complete(){score+=Math.ceil(time)*5+level*150;save();beep(1080);if(level===3){finish(true);return}level++;setup()}
function move(dir){if(state!=="playing"||!dirs[dir])return false;let [dx,dy]=dirs[dir],next={x:player.x+dx,y:player.y+dy};if(!floor(next.x,next.y))return false;player=next;let i=cheese.findIndex(p=>eq(p,player));if(i>=0){cheese.splice(i,1);score+=250;save();toast("🧀 CHEESE!");beep(830)}if(eq(player,cat))hurt();if(state!=="playing")return true;if(eq(player,exit)&&cheese.length===0){complete();return true}render();hud();return true}
function chase(){let dist=bfs(player),next=adj(cat).filter(p=>dist.has(pos(p.x,p.y)));if(next.length){next.sort((a,b)=>dist.get(pos(a.x,a.y))-dist.get(pos(b.x,b.y)));cat=next[0]}if(eq(player,cat))hurt();render()}
function finish(win){if(state!=="playing")return;state="over";save();hud();overlay(win?"ESCAPE MASTER!":"GAME OVER",win?"3つの迷路を脱出！ 合計 "+score+"点。":"時間切れかネコに捕まったで。スコア "+score+"点。")}
function update(dt){if(state!=="playing")return;time=Math.max(0,time-dt);shield=Math.max(0,shield-dt);catWait-=dt;if(catWait<=0){catWait=1.65-(level-1)*.21;chase()}if(time<=0)finish(false);hud()}
function loop(now){let dt=Math.min(.08,Math.max(0,(now-last)/1000||0));last=now;update(dt);requestAnimationFrame(loop)}
$("overlay").addEventListener("click",e=>{if(e.target.closest("#start"))start()});
document.querySelectorAll("[data-dir]").forEach(b=>b.addEventListener("click",()=>move(b.dataset.dir)));
window.addEventListener("keydown",e=>{let d={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",a:"left",s:"down",d:"right"}[e.key];if(d){e.preventDefault();move(d)}});
$("maze").addEventListener("touchstart",e=>{let t=e.changedTouches[0];if(t)touch={x:t.clientX,y:t.clientY}},{passive:true});
$("maze").addEventListener("touchend",e=>{if(!touch)return;let t=e.changedTouches[0];if(!t)return;let dx=t.clientX-touch.x,dy=t.clientY-touch.y;touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;e.preventDefault();move(Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up"))},{passive:false});
overlay("ハムスター大脱走","🧀チーズを3個集めたら🚪出口へ。🐈ネコから逃げながら、3つのランダム迷路を突破しよう！");map=Array(N*N).fill(1);for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++)map[pos(x,y)]=0;render();hud();requestAnimationFrame(loop);
