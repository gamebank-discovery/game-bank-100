('div');modal.id='gb-pause-screen';modal.className='gb-pause';modal.innerHTML='<div>⏸ PAUSED<div><button id="gb-resume-btn">▶ ゲームに戻る</button></div></div>';document.body.appendChild(modal);document.getElementById('gb-pause-btn').onclick=()=>setPaused(!paused);document.getElementById('gb-resume-btn').onclick=()=>setPaused(false);document.getElementById('gb-mute-btn').onclick=()=>setMuted(!muted);document.getElementById('gb-restart-btn').onclick=()=>location.reload();window.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();setPaused(!paused)}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused)setPaused(true)});});})();</script><link rel="stylesheet" href="/assets/mobile-fit.css"></head><body><div class="wrap"><nav><a href="/">← GAME BANK</a><b>#15 · 動物アクション</b></nav><h1>🐢 カメターボ</h1><p>カメがターボシールドで敵をはじく3レーン・サバイバル。コイン回収とステージアップ、ライフ・スコア・効果音・ハイスコア保存。</p><div class="hud"><div><small>SCORE</small><b id="score">0</b></div><div><small>BEST</small><b id="best">0</b></div><div><small>LIVES</small><b id="life">♥♥♥</b></div><div><small>STAGE</small><b id="stage">1</b></div></div><div class="board"><canvas id="cv" width="420" height="620"></canvas><div class="overlay" id="overlay"><div><div style="font-size:64px">🐢</div><h2>カメターボ</h2><p>カメがターボシールドで敵をはじく3レーン・サバイバル。コイン回収とステージアップ、ライフ・スコア・効果音・ハイスコア保存。</p><button>▶ START</button></div></div></div><div class="controls"><button id="b0">◀ LEFT</button><button id="b1">RIGHT ▶</button><button id="b2">⚡ SHIELD</button></div><p>スマホは画面タップとボタン。PCはキーボードにも対応するで。</p></div><script>(()=>{"use strict";const GAMEID=15,COLOR="#255e66",HERO="🐢",ENEMY="🦀";const $=id=>document.getElementById(id),cv=$("cv"),c=cv.getContext("2d"),ov=$("overlay"),W=420,H=620;let mode="menu",score=0,best=0,life=3,t=0,last=0,stage=1,objects=[],spawn=0,player=210,dir=0,ability=0,combo=0,level=1,audio=null;try{best=Number(localStorage.getItem("gb-"+GAMEID))||0}catch{}function beep(f=550){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain(),now=audio.currentTime;o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.065,now);g.gain.exponentialRampToValueAtTime(.001,now+.14);o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+.15)}catch{}}function ui(){$("score").textContent=score;$("best").textContent=best;$("life").textContent="♥".repeat(Math.max(0,life));$("stage").textContent=stage}function award(n){score+=n;if(score>best){best=score;try{localStorage.setItem("gb-"+GAMEID,String(best))}catch{}}ui()}function start(){mode="play";score=0;life=3;t=0;stage=1;objects=[];spawn=.5;player=210;dir=0;ability=0;combo=0;level=1;ov.classList.add("hide");ui()}function end(win=false){if(mode!=="play")return;mode="over";ov.innerHTML='<div><div style="font-size:64px">'+(win?"🏆":"💥")+'</div><h2>'+(win?"CLEAR!":"GAME OVER")+'</h2><p>SCORE '+score+' · BEST '+best+'</p><button>↻ RETRY</button></div>';ov.classList.remove("hide")}function hurt(){life--;beep(155);if(life<=0)end();ui()}function background(){let g=c.createLinearGradient(0,0,0,620);g.addColorStop(0,COLOR);g.addColorStop(1,"#0b142d");c.fillStyle=g;c.fillRect(0,0,420,620);c.textAlign="center";c.fillStyle="#eafff2";c.font="bold 15px system-ui";c.fillText("STAGE "+stage+" · SCORE "+score,210,32)}function loop(ts){let dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(mode==="play"){t+=dt;update(dt)}draw();requestAnimationFrame(loop)}ov.addEventListener("click",e=>{if(e.target.closest("button"))start()});window.addEventListener("blur",()=>dir=0);function update(dt){player=Math.max(52,Math.min(368,player+dir*270*dt));spawn-=dt;if(spawn<=0){objects.push({x:50+Math.random()*320,y:-30,kind:Math.random()<.35?"coin":"enemy",hit:false});spawn=Math.max(.34,.85-t*.003)}for(let p of objects){p.y+=(200+stage*35)*dt;if(!p.hit&&Math.abs(p.x-player)<36&&Math.abs(p.y-525)<38){p.hit=true;if(p.kind==="coin"){award(150);combo++;beep(880)}else if(ability>0){award(100);beep(700)}else{combo=0;hurt()}}}objects=objects.filter(p=>!p.hit&&p.y<650);ability=Math.max(0,ability-dt);if(t>stage*16){stage++;life=Math.min(5,life+1);beep(950)}award(Math.floor(dt*30))}function draw(){background();c.fillStyle="#a7e4d722";c.fillRect(38,0,344,620);for(let i=0;i<3;i++){c.strokeStyle="#ffffff33";c.strokeRect(38+i*114,0,114,620)}c.font="44px system-ui";for(let p of objects)c.fillText(p.kind==="coin"?"🪙":ENEMY,p.x,p.y+15);c.font="64px system-ui";c.fillText(HERO,player,547);if(ability>0){c.strokeStyle="#d9ff8b";c.lineWidth=5;c.beginPath();c.arc(player,520,43,0,Math.PI*2);c.stroke()}c.fillStyle="#fff";c.font="bold 13px system-ui";c.fillText("MOVE ◀ ▶ · SKILL TO SHIELD",210,605)}function skill(){if(mode==="play"&&ability<=0){ability=1.3;beep(1200)}}$("b0").addEventListener("pointerdown",e=>{e.preventDefault();dir=-1});$("b1").addEventListener("pointerdown",e=>{e.preventDefault();dir=1});for(let id of ["b0","b1"])for(let ev of ["pointerup","pointercancel","pointerleave"])$(id).addEventListener(ev,()=>dir=0);$("b2").addEventListener("click",skill);cv.addEventListener("pointerdown",e=>{e.preventDefault();skill()});window.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")dir=-1;if(e.key==="ArrowRight")dir=1;if(e.code==="Space"&&!e.repeat){e.preventDefault();skill()}});window.addEventListener("keyup",e=>{if(["ArrowLeft","ArrowRight"].includes(e.key))dir=0});ui();requestAnimationFrame(loop)})();</script><script src="/assets/mobile-fit.js" defer></script><script src="/assets/audio-v3.js" defer></script><script defer src="/assets/play-track.js" data-game-map='{"":"15"}'></script></body></html><script async data-explicit-opt-in="true" data-deployment-id="dpl_6ZiQNpeQpCs2iqdKbuWVm7ujAcYx" src="https://vercel.live/_next-live/feedback/feedback.js"></script><script async data-explicit-opt-in="true" data-deployment-id="dpl_xwYmVq8LuYUGmnGB8NE3ki3Yr2TE" src="https://vercel.live/_next-live/feedback/feedback.js"></script>
