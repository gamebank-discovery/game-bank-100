-100.vercel.app/games/expanded/61/index.html"><style id="gb-quality-css">.gb-tools{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 8px}.gb-tools button{flex:1;min-width:90px;background:#18304d;border:1px solid #83a7bb;border-radius:10px;color:#f2fbff;padding:12px 8px;font:700 13px system-ui;touch-action:manipulation}.gb-tools button:focus-visible{outline:3px solid #e5ffac}.gb-pause{position:fixed;inset:0;background:#071528ec;display:none;z-index:99999;place-items:center;color:white;font:700 28px system-ui;text-align:center;padding:25px}.gb-pause.show{display:grid}.gb-pause button{background:#d4ff9d;color:#193a25;padding:15px 26px;border:0;border-radius:13px;font:800 17px system-ui;margin-top:20px}</style><script id="gb-quality-js">(()=>{'use strict';if(window.__gbQuality)return;window.__gbQuality=true;const nativeRAF=window.requestAnimationFrame.bind(window),pending=new Map();let paused=false,muted=false,next=1;window.requestAnimationFrame=function(fn){const id=next++;function run(t){if(paused){pending.set(id,run);return}pending.delete(id);fn(t)}nativeRAF(run);return id};const AC=window.AudioContext||window.webkitAudioContext;const contexts=[];if(AC){const Wrapped=function(...args){const c=new AC(...args);contexts.push(c);const resume=c.resume.bind(c);c.resume=function(){return muted?Promise.resolve():resume()};if(muted)c.suspend();return c};Wrapped.prototype=AC.prototype;try{if(window.AudioContext)window.AudioContext=Wrapped;if(window.webkitAudioContext)window.webkitAudioContext=Wrapped}catch{}}function setPaused(v){paused=v;document.getElementById('gb-pause-screen').classList.toggle('show',v);document.getElementById('gb-pause-btn').textContent=v?'▶ 再開':'⏸ 一時停止';if(!v){const tasks=[...pending.values()];pending.clear();for(const fn of tasks)nativeRAF(fn)}}function setMuted(v){muted=v;document.getElementById('gb-mute-btn').textContent=v?'🔇 音を戻す':'🔊 音を消す';for(const c of contexts){try{v?c.suspend():c.resume()}catch{}}}document.addEventListener('DOMContentLoaded',()=>{const host=document.createElement('div');host.className='gb-tools';host.innerHTML='<button id="gb-pause-btn" type="button">⏸ 一時停止</button><button id="gb-mute-btn" type="button">🔊 音を消す</button><button id="gb-restart-btn" type="button">↻ 最初から</button>';const target=document.querySelector('canvas')?.parentElement||document.body;target.insertAdjacentElement('afterend',host);const modal=document.createElement('div');modal.id='gb-pause-screen';modal.className='gb-pause';modal.innerHTML='<div>⏸ PAUSED<div><button id="gb-resume-btn">▶ ゲームに戻る</button></div></div>';document.body.appendChild(modal);document.getElementById('gb-pause-btn').onclick=()=>setPaused(!paused);document.getElementById('gb-resume-btn').onclick=()=>setPaused(false);document.getElementById('gb-mute-btn').onclick=()=>setMuted(!muted);document.getElementById('gb-restart-btn').onclick=()=>location.reload();window.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();setPaused(!paused)}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused)setPaused(true)});});})();</script><link rel="stylesheet" href="/assets/mobile-fit.css"></head><body><div class="wrap"><nav class="top"><a href="/">← GAME <b>BANK</b></a><span class="tag">PUZZLE / #061</span></nav><header><div class="sub">CLASSIC NUMBER PUZZLE</div><h1>数字2048進化</h1><p class="intro">同じ数字のタイルを合体させて、2048のタイルを作ろう。PCは矢印キー、スマホはスワイプで操作できます。</p></header><div class="stats"><div class="stat"><small>SCORE</small><strong id="score">0</strong></div><div class="stat"><small>BEST</small><strong id="best">0</strong></div></div><main><div class="gridWrap"><div class="grid" id="board" aria-label="4行4列の2048ゲーム盤"></div><div class="screen hidden" id="message"><article><h2 id="resultTitle"></h2><p id="resultDesc"></p><button class="primary" id="again">もう一度遊ぶ</button></article></div></div><div class="actions"><button class="primary" id="newGame">新しいゲーム</button><span class="desc">目標：2048タイル</span></div><div class="moves"><span></span><button data-dir="up" aria-label="上へ">↑</button><span></span><button data-dir="left" aria-label="左へ">←</button><button data-dir="down" aria-label="下へ">↓</button><button data-dir="right" aria-label="右へ">→</button></div><p class="desc">同じ数字同士は1回の移動で1度だけ合体します。有効な移動の後、新しい2または4のタイルが出現します。手詰まりになるとゲームオーバーです。</p></main></div><script>"use strict";
const SIZE=4,GOAL=2048,STORAGE="gb-remix-61",boardEl=document.getElementById("board"),scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),overlay=document.getElementById("message"),resultTitle=document.getElementById("resultTitle"),resultDesc=document.getElementById("resultDesc");
let board=Array(16).fill(0),score=0,best=0,state="playing",touchStart=null;
try{best=Number(localStorage.getItem(STORAGE)||localStorage.getItem("gamebank-expanded-61")||0)||0}catch{}
function store(){try{localStorage.setItem(STORAGE,String(best));localStorage.setItem("gamebank-expanded-61",String(best))}catch{}}
function emptySlots(){const a=[];for(let i=0;i<16;i++)if(board[i]===0)a.push(i);return a}
function spawn(){const empty=emptySlots();if(!empty.length)return false;const index=empty[Math.floor(Math.random()*empty.length)];board[index]=Math.random()<.9?2:4;return true}
function canMove(){if(board.includes(0))return true;for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++){const k=y*SIZE+x;if(x<3&&board[k]===board[k+1])return true;if(y<3&&board[k]===board[k+SIZE])return true}return false}
function indices(direction,line){const idx=[];for(let i=0;i<SIZE;i++){if(direction==="left")idx.push(line*SIZE+i);else if(direction==="right")idx.push(line*SIZE+(SIZE-1-i));else if(direction==="up")idx.push(i*SIZE+line);else if(direction==="down")idx.push((SIZE-1-i)*SIZE+line)}return idx}
function mergeLine(values){const packed=values.filter(v=>v>0),merged=[];let gained=0;for(let i=0;i<packed.length;i++){if(packed[i]===packed[i+1]){let n=packed[i]*2;merged.push(n);gained+=n;i++}else merged.push(packed[i])}while(merged.length<SIZE)merged.push(0);return {values:merged,gained}}
function showResult(title,desc){state="over";resultTitle.textContent=title;resultDesc.textContent=desc;overlay.classList.remove("hidden")}
function draw(){boardEl.replaceChildren(...board.map(n=>{const cell=document.createElement("div");cell.className="cell";cell.dataset.v=String(n);cell.textContent=n?String(n):"";return cell}));scoreEl.textContent=score.toLocaleString();bestEl.textContent=best.toLocaleString()}
function move(direction){if(state!=="playing"||!["left","right","up","down"].includes(direction))return false;const old=board.slice();let points=0;for(let line=0;line<SIZE;line++){const ids=indices(direction,line),part=mergeLine(ids.map(i=>old[i]));ids.forEach((idx,j)=>{board[idx]=part.values[j]});points+=part.gained}if(board.every((v,i)=>v===old[i])){if(!canMove())showResult("GAME OVER","上下左右どこにも動かせなくなりました。");return false;}score+=points;if(score>best){best=score;store()}spawn();draw();if(board.some(v=>v>=GOAL))showResult("2048 達成！","2048タイルの完成、おめでとう！");else if(!canMove())showResult("GAME OVER","上下左右どこにも動かせなくなりました。");return true}
function reset(){board.fill(0);score=0;state="playing";overlay.classList.add("hidden");spawn();spawn();draw()}
document.addEventListener("keydown",event=>{const dirs={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down"};if(dirs[event.key]){event.preventDefault();move(dirs[event.key])}});
boardEl.addEventListener("touchstart",e=>{const t=e.changedTouches[0];if(t)touchStart={x:t.clientX,y:t.clientY}},{passive:true});
boardEl.addEventListener("touchend",e=>{if(!touchStart)return;const t=e.changedTouches[0];if(!t)return;const dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;touchStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;e.preventDefault();move(Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up"))},{passive:false});
document.querySelectorAll("[data-dir]").forEach(el=>el.addEventListener("click",()=>move(el.dataset.dir)));
document.getElementById("newGame").addEventListener("click",reset);document.getElementById("again").addEventListener("click",reset);
reset();</script><script src="/assets/mobile-fit.js" defer></script><script src="/assets/audio-v3.js" defer></script><script defer src="/assets/play-track.js" data-game-map='{"":"61"}'></script></body></html><script async data-explicit-opt-in="true" data-deployment-id="dpl_6ZiQNpeQpCs2iqdKbuWVm7ujAcYx" src="https://vercel.live/_next-live/feedback/feedback.js"></script><script async data-explicit-opt-in="true" data-deployment-id="dpl_xwYmVq8LuYUGmnGB8NE3ki3Yr2TE" src="https://vercel.live/_next-live/feedback/feedback.js"></script>
