<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大喜利キング</title><style>*{box-sizing:border-box}body{background:#0b1930;color:white;font-family:system-ui;margin:0}main{max-width:520px;margin:auto;padding:14px}a{color:#c8ffa9}p{color:#b7cde4}.hud,.buttons{display:flex;gap:6px;justify-content:space-between;margin:12px 0}.hud span{background:#213a57;padding:10px 4px;border-radius:8px;flex:1;text-align:center;font-size:12px}button{flex:1;background:#315579;border:1px solid #85a4c5;color:white;border-radius:10px;padding:15px 3px;font-weight:bold;touch-action:manipulation}.board{position:relative}canvas{width:100%;aspect-ratio:420/620;touch-action:none;border:2px solid #789abc;border-radius:12px}.overlay{position:absolute;inset:0;background:#091a31e8;display:grid;place-items:center;text-align:center}.hide{display:none}</style><link rel="stylesheet" href="/assets/mobile-fit.css"></head><body><main><a href="/">← GAME BANK</a><h1>🤣 大喜利キング</h1><p>4択の問題に答えてステージを進めるゲーム</p><div class="hud"><span>SCORE <b id="score">0</b></span><span>BEST <b id="best">0</b></span><span>HP <b id="hp">5</b></span><span>LEVEL <b id="level">1</b></span></div><div class="board"><canvas id="cv" width="420" height="620"></canvas><div id="overlay" class="overlay"><div><h2>大喜利キング</h2><p>4択の問題に答えてステージを進めるゲーム</p><button id="start">▶ START</button></div></div></div><div class="buttons"><button id="a">◀ / 1</button><button id="b">▶ / 2</button><button id="d">⚡ / 3</button><button id="e">4</button></div><div class="buttons"><button id="pause">⏸ 一時停止</button><button id="mute">🔊 音</button><button id="retry">↻ 最初から</button></div></main><script>(()=>{'use strict';const ID=88,TITLE="大喜利キング",$=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),ov=$('overlay');let active=false,paused=false,score=0,best=0,hp=5,level=1,turn=0,answer=0,position=0,grid=[],question='',choices=[],last=0;try{best=+localStorage.getItem('gb-v3-'+ID)||0}catch{}function ui(){$('score').textContent=score;$('best').textContent=best;$('hp').textContent=hp;$('level').textContent=level;$('pause').textContent=paused?'▶ 再開':'⏸ 一時停止'}function gain(n){score+=n;if(score>best){best=score;try{localStorage.setItem('gb-v3-'+ID,String(best))}catch{}}ui()}function beep(f){try{window.GBQuality?.play(f)}catch{}}function fail(){hp--;beep(180);if(hp<=0)end(false);ui()}function end(win){active=false;ov.classList.remove('hide');ov.innerHTML='<div><h2>'+(win?'🏆 CLEAR!':'💥 GAME OVER')+'</h2><p>SCORE '+score+' / BEST '+best+'</p><button id="start">↻ RETRY</button></div>'}function start(){active=true;paused=false;score=0;hp=5;level=1;turn=0;position=0;setup();ov.classList.add('hide');ui()}function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}function text(s,x,y,size=20){ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold '+size+'px system-ui';ctx.fillText(s,x,y)}function frame(){ctx.fillStyle='#182d47';ctx.fillRect(0,0,420,620);if(active)draw();else{text(TITLE,210,210,28);text('▶ START',210,300,25)}requestAnimationFrame(frame)}function input(i){if(!active||paused)return;action(i)}ov.addEventListener('click',e=>{if(e.target.closest('button'))start()});['a','b','d','e'].forEach((k,i)=>$(k).addEventListener('pointerdown',e=>{e.preventDefault();input(i)}));$('retry').onclick=start;$('pause').onclick=()=>{if(active){paused=!paused;ui()}};$('mute').onclick=()=>{let b=$('gb-qa-audio');if(b)b.click()};cv.addEventListener('pointerdown',e=>{if(!active||paused)return;let r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*420,y=(e.clientY-r.top)/r.height*620;canvasInput(x,y)});window.addEventListener('keydown',e=>{if(e.repeat)return;let keys=['1','2','3','4'];let i=keys.indexOf(e.key);if(i>=0)input(i);if(e.key==='ArrowUp')input(0);if(e.key==='ArrowDown')input(1);if(e.key==='ArrowLeft')input(2);if(e.key==='ArrowRight')input(3)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&active){paused=true;ui()}});const bank=[['日本の首都は？',['東京','大阪','京都','名古屋'],0],['3 × 7 = ?',['18','21','24','27'],1],['太陽系で最も大きな惑星は？',['火星','金星','木星','水星'],2],['日本で一番高い山は？',['阿蘇山','富士山','高尾山','六甲山'],1],['水の化学式は？',['CO2','O2','H2O','NaCl'],2],['1時間は何秒？',['360','3600','600','6000'],1],['英語で犬は？',['cat','bird','dog','fish'],2],['正三角形の内角は？',['30°','45°','60°','90°'],2],['日本の通貨単位は？',['ドル','円','ユーロ','ポンド'],1],['5の2乗は？',['10','15','20','25'],3],['地球の衛星は？',['月','火星','太陽','金星'],0],['虹は通常何色？',['5','6','7','8'],2]];function setup(){let item=bank[(turn+ID)%bank.length];question=item[0];let offset=(turn*3+ID)%4;choices=Array.from({length:4},(_,i)=>item[1][(i+offset)%4]);answer=(item[2]-offset+4)%4}function action(i){if(i===answer){gain(100+level*30);beep(880)}else fail();turn++;if(turn%4===0){level++;hp=Math.min(5,hp+1);ui()}if(level>4){end(true);return}setup()}function canvasInput(x,y){if(y<330||y>570)return;let col=x<210?0:1,row=y<450?0:1;input(row*2+col)}function draw(){text('🧠 '+TITLE,210,105,27);text('問題 '+(turn+1),210,185,24);text(question,210,280,question.length>18?17:22);for(let i=0;i<4;i++){let x=16+(i%2)*205,y=350+Math.floor(i/2)*105;rect(x,y,184,92,'#355e80');text((i+1)+'. '+choices[i],x+92,y+54,choices[i].length>9?15:19)}text('正解で得点・不正解でHP減少',210,604,15)}ui();requestAnimationFrame(frame)})();</script><script src="/assets/mobile-fit.js" defer></script><script src="/assets/audio-v3.js" defer></script><script defer src="/assets/play-track.js" data-game-map='{"":"88"}'></script></body></html><script async data-explicit-opt-in="true" data-deployment-id="dpl_6ZiQNpeQpCs2iqdKbuWVm7ujAcYx" src="https://vercel.live/_next-live/feedback/feedback.js"></script><script async data-explicit-opt-in="true" data-deployment-id="dpl_xwYmVq8LuYUGmnGB8NE3ki3Yr2TE" src="https://vercel.live/_next-live/feedback/feedback.js"></script>
