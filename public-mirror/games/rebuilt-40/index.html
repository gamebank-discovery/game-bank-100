<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ラップバトルAI</title><style>*{box-sizing:border-box}body{background:#0b1930;color:white;font-family:system-ui;margin:0}main{max-width:520px;margin:auto;padding:14px}a{color:#c8ffa9}p{color:#b7cde4}.hud,.buttons{display:flex;gap:6px;justify-content:space-between;margin:12px 0}.hud span{background:#213a57;padding:10px 4px;border-radius:8px;flex:1;text-align:center;font-size:12px}button{flex:1;background:#315579;border:1px solid #85a4c5;color:white;border-radius:10px;padding:15px 3px;font-weight:bold;touch-action:manipulation}.board{position:relative}canvas{width:100%;aspect-ratio:420/620;touch-action:none;border:2px solid #789abc;border-radius:12px}.overlay{position:absolute;inset:0;background:#091a31e8;display:grid;place-items:center;text-align:center}.hide{display:none}</style><link rel="stylesheet" href="/assets/mobile-fit.css"></head><body><main><a href="/">← GAME BANK</a><h1>🎙️ ラップバトルAI</h1><p>4レーンの音符を叩くリズムゲーム</p><div class="hud"><span>SCORE <b id="score">0</b></span><span>BEST <b id="best">0</b></span><span>HP <b id="hp">5</b></span><span>LEVEL <b id="level">1</b></span></div><div class="board"><canvas id="cv" width="420" height="620"></canvas><div id="overlay" class="overlay"><div><h2>ラップバトルAI</h2><p>4レーンの音符を叩くリズムゲーム</p><button id="start">▶ START</button></div></div></div><div class="buttons"><button id="a">◀ / 1</button><button id="b">▶ / 2</button><button id="d">⚡ / 3</button><button id="e">4</button></div><div class="buttons"><button id="pause">⏸ 一時停止</button><button id="mute">🔊 音</button><button id="retry">↻ 最初から</button></div></main><script>(()=>{"use strict";const ID=40,ICON="🎙️",MODE="rhythm",$=id=>document.getElementById(id),cv=$("cv"),c=cv.getContext("2d");let on=false,pause=false,mute=false,score=0,hp=5,level=1,best=0,t=0,last=0,items=[],pos=1,cash=0,staff=0,upgrade=1,combo=0,ac;try{best=+localStorage.getItem("gb-new-"+ID)||0}catch{}function tone(f){if(mute)return;try{ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume();let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.frequency.value=f;g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.11)}catch{}}function ui(){$("score").textContent=score;$("best").textContent=best;$("hp").textContent=hp;$("level").textContent=level}function gain(n){score+=n;if(score>best){best=score;try{localStorage.setItem("gb-new-"+ID,String(best))}catch{}}ui()}function hurt(){hp--;tone(150);if(hp<=0)end(false);ui()}function end(win){on=false;$("overlay").classList.remove("hide");$("overlay").innerHTML='<div><h2>'+(win?"🏆 CLEAR":"💥 GAME OVER")+'</h2><p>SCORE '+score+'</p><button id="start">↻ RETRY</button></div>'}function start(){on=true;pause=false;score=0;hp=5;level=1;t=0;items=[];pos=1;cash=0;staff=0;upgrade=1;combo=0;$("overlay").classList.add("hide");ui()}function action(i){if(!on||pause)return;if(MODE==="economy"){if(i===0){cash+=upgrade;gain(upgrade)}if(i===1&&cash>=20+staff*20){cash-=20+staff*20;staff++}if(i===2&&cash>=upgrade*35){cash-=upgrade*35;upgrade++}}else if(MODE==="rhythm"){let n=items.filter(x=>x.lane===i).sort((a,b)=>Math.abs(a.y-490)-Math.abs(b.y-490))[0];if(n&&Math.abs(n.y-490)<80){n.hit=true;combo++;gain(100+combo*5);tone(450+i*90)}else{combo=0;hurt()}}else if(MODE==="quiz"){if(i===(Math.floor(t/2)+ID)%4)gain(180);else hurt();t+=2}else if(MODE==="maze"){pos=Math.max(0,Math.min(24,pos+(i===0?-5:i===1?5:i===2?-1:1)));if(pos===24){gain(500);level++;pos=0;if(level>5)end(true)}}else{if(i===0)pos=Math.max(0,pos-1);if(i===1)pos=Math.min(2,pos+1);if(i===2)gain(1)}}function update(dt){t+=dt;if(MODE==="economy"){if(t>1){t=0;cash+=staff*upgrade;gain(staff*upgrade)}}else if(MODE==="rhythm"||MODE==="runner"||MODE==="catch"){if(Math.random()<dt*(MODE==="rhythm"?1.6:1.3))items.push({lane:Math.floor(Math.random()*(MODE==="rhythm"?4:3)),y:-20,hit:false,good:Math.random()<.28});for(let n of items){n.y+=240*dt;if(n.y>520&&!n.hit){n.hit=true;if(MODE==="rhythm")hurt();else if(n.lane===pos){if(n.good)gain(100);else hurt()}}}items=items.filter(n=>!n.hit&&n.y<650)}if(score>=level*900){level++;hp=Math.min(5,hp+1);ui()}if(level>5)end(true)}function draw(){c.fillStyle="#19334d";c.fillRect(0,0,420,620);c.textAlign="center";c.fillStyle="white";c.font="bold 24px system-ui";c.fillText(ICON,210,125);if(MODE==="economy"){c.font="bold 30px system-ui";c.fillText("資金 "+cash,210,290);c.fillText("スタッフ "+staff,210,355);c.fillText("設備 "+upgrade,210,415)}else if(MODE==="maze"){for(let j=0;j<25;j++){let x=35+j%5*72,y=175+Math.floor(j/5)*72;c.fillStyle="#365b7a";c.fillRect(x,y,65,65);c.fillStyle="white";c.font="29px system-ui";c.fillText(j===pos?ICON:j===24?"🚪":"",x+32,y+44)}}else if(MODE==="quiz"){c.font="bold 28px system-ui";c.fillText("4択クイズ",210,310);c.font="18px system-ui";c.fillText("正解は1〜4のどれ？",210,360)}else{for(let i=0;i<(MODE==="rhythm"?4:3);i++){c.strokeStyle="#7996b4";c.strokeRect(i*(420/(MODE==="rhythm"?4:3)),170,420/(MODE==="rhythm"?4:3),440)}for(let n of items){c.font="38px system-ui";c.fillText(MODE==="rhythm"?"🎵":n.good?"⭐":"💥",(n.lane+.5)*420/(MODE==="rhythm"?4:3),n.y)}if(MODE!=="rhythm"){c.font="60px system-ui";c.fillText(ICON,(pos+.5)*140,535)}else{c.fillStyle="#b4ffb555";c.fillRect(0,470,420,55)}}c.fillStyle="white";c.font="14px system-ui";c.fillText("LEVEL "+level+" · SCORE "+score,210,604)}function loop(ms){let dt=Math.min(.05,(ms-last)/1000||0);last=ms;if(on&&!pause)update(dt);draw();requestAnimationFrame(loop)}$("overlay").onclick=e=>{if(e.target.closest("button"))start()};["a","b","d","e"].forEach((x,i)=>$(x).addEventListener("pointerdown",e=>{e.preventDefault();action(i)}));$("pause").onclick=()=>{pause=!pause};$("mute").onclick=()=>{mute=!mute};$("retry").onclick=start;cv.addEventListener("pointerdown",e=>{e.preventDefault();let r=cv.getBoundingClientRect();action(Math.min(3,Math.floor((e.clientX-r.left)/r.width*4)))});window.addEventListener("keydown",e=>{let k=["ArrowLeft","ArrowRight"," ","ArrowUp"].indexOf(e.key);if(k>=0&&!e.repeat)action(k)});document.addEventListener("visibilitychange",()=>{if(document.hidden)pause=true});ui();requestAnimationFrame(loop)})();</script><script src="/assets/mobile-fit.js" defer></script><script src="/assets/audio-v3.js" defer></script><script defer src="/assets/play-track.js" data-game-map='{"":"40"}'></script></body></html><script async data-explicit-opt-in="true" data-deployment-id="dpl_6ZiQNpeQpCs2iqdKbuWVm7ujAcYx" src="https://vercel.live/_next-live/feedback/feedback.js"></script><script async data-explicit-opt-in="true" data-deployment-id="dpl_xwYmVq8LuYUGmnGB8NE3ki3Yr2TE" src="https://vercel.live/_next-live/feedback/feedback.js"></script>
