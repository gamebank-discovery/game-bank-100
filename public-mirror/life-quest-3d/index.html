<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>LIFE QUEST 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1424;color:white;font-family:system-ui}canvas{display:block}#hud{position:fixed;top:12px;left:12px;background:#0b1534dd;padding:12px;border:1px solid #7b86b7;border-radius:15px;max-width:290px}button,input{font:inherit;border-radius:10px;padding:10px;border:0}button{background:#ffcb62;color:#1c2030;font-weight:800;margin:3px;cursor:pointer}input{width:180px}#pad{position:fixed;bottom:18px;left:15px;display:grid;grid-template-columns:repeat(3,48px);gap:3px}#pad button{height:48px;padding:0;touch-action:none}#quests{max-height:32vh;overflow:auto}small{color:#c7d4f4}#tip{position:fixed;right:12px;bottom:20px;background:#101e3dbb;padding:9px;border-radius:10px;max-width:170px;font-size:12px}</style></head><body><div id="hud"><b>⚔️ LIFE QUEST 3D</b><div id="stats"></div><input id="task" placeholder="現実のクエスト"><button id="add">追加</button><div id="quests"></div><small>現実で達成したらクリア！</small></div><div id="pad"><span></span><button data-m="f">▲</button><span></span><button data-m="l">◀</button><button data-m="b">▼</button><button data-m="r">▶</button></div><div id="tip">WASD / 矢印キーで移動。クエストを達成すると街が発展！</div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';const key='discovery-lifequest3d-v1';let save;try{save=JSON.parse(localStorage.getItem(key))}catch{}save=save&&Array.isArray(save.tasks)?save:{xp:0,gold:0,tasks:[{name:'15分だけ片付ける',done:false},{name:'新しいアイデアを考える',done:false}]};const persist=()=>localStorage.setItem(key,JSON.stringify(save));const stats=document.querySelector('#stats'),quests=document.querySelector('#quests');function draw(){stats.textContent='LV '+(1+Math.floor(save.xp/100))+'  ✨ '+save.xp+' XP  🪙 '+save.gold+' G';quests.replaceChildren();save.tasks.forEach((t,i)=>{const row=document.createElement('div');const b=document.createElement('button');b.textContent=t.done?'✓ 達成':'⚔️ クリア';b.disabled=t.done;b.onclick=()=>{if(t.done)return;t.done=true;save.xp+=25;save.gold+=10;persist();draw();buildTown()};const label=document.createElement('span');label.textContent=' '+t.name;row.append(b,label);quests.append(row)})}document.querySelector('#add').onclick=()=>{const input=document.querySelector('#task');const name=input.value.trim();if(!name)return;save.tasks.push({name,done:false});input.value='';persist();draw()};draw();const scene=new THREE.Scene();scene.background=new THREE.Color('#83c7ef');scene.fog=new THREE.Fog('#83c7ef',20,65);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,100);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x52705b,2));const sun=new THREE.DirectionalLight(0xfff0c4,2);sun.position.set(10,20,8);scene.add(sun);const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.85});const grass=mat('#78b86c'),wood=mat('#9a704c'),roof=mat('#d96566'),stone=mat('#aab8c1');function cube(w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);return o}cube(60,.6,60,grass,0,-.4,0);const hero=new THREE.Group();hero.add(new THREE.Mesh(new THREE.CapsuleGeometry(.38,.85,4,8),mat('#466bce')));const head=new THREE.Mesh(new THREE.SphereGeometry(.35,12,10),mat('#ffe0a6'));head.position.y=.85;hero.add(head);hero.position.y=.9;scene.add(hero);for(let i=0;i<48;i++){let a=i*2.4,r=7+(i%6)*3,x=Math.sin(a)*r,z=Math.cos(a)*r;const trunk=cube(.3,1.5,.3,wood,x,.7,z);const crown=new THREE.Mesh(new THREE.ConeGeometry(.9,2.3,6),mat(i%2?'#367f52':'#4d9d65'));crown.position.set(x,2.5,z);scene.add(crown)}let town=[];function buildTown(){town.forEach(o=>scene.remove(o));town=[];const count=Math.min(12,2+Math.floor(save.xp/50));for(let i=0;i<count;i++){let x=-9+(i%4)*5,z=-11+Math.floor(i/4)*5;const home=new THREE.Group();const walls=new THREE.Mesh(new THREE.BoxGeometry(2.5,2,2.5),mat(i%2?'#ffdfa8':'#f4c8aa'));walls.position.y=1;home.add(walls);const top=new THREE.Mesh(new THREE.ConeGeometry(2.1,1.5,4),roof);top.rotation.y=Math.PI/4;top.position.y=2.7;home.add(top);home.position.set(x,0,z);scene.add(home);town.push(home)}}buildTown();const held=new Set();addEventListener('keydown',e=>held.add(e.key.toLowerCase()));addEventListener('keyup',e=>held.delete(e.key.toLowerCase()));document.querySelectorAll('[data-m]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();held.add(b.dataset.m);b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>held.delete(b.dataset.m))});let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;let dx=0,dz=0;if(held.has('w')||held.has('arrowup')||held.has('f'))dz-=1;if(held.has('s')||held.has('arrowdown')||held.has('b'))dz+=1;if(held.has('a')||held.has('arrowleft')||held.has('l'))dx-=1;if(held.has('d')||held.has('arrowright')||held.has('r'))dx+=1;const len=Math.hypot(dx,dz)||1;hero.position.x=THREE.MathUtils.clamp(hero.position.x+dx/len*dt*5,-27,27);hero.position.z=THREE.MathUtils.clamp(hero.position.z+dz/len*dt*5,-27,27);if(dx||dz)hero.rotation.y=Math.atan2(-dx,-dz);camera.position.lerp(new THREE.Vector3(hero.position.x+7,8,hero.position.z+11),.07);camera.lookAt(hero.position.x,1,hero.position.z);renderer.render(scene,camera)}requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
