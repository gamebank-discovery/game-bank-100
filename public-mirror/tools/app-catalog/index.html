<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101829"><title>GAME BANK | ゲーム・アプリ一覧</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#0b1220;color:#edf4ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0%,#23365a 0%,#0b1220 44%)}main{max-width:1150px;margin:auto;padding:28px 18px 90px}a{color:inherit}header{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-size:13px;letter-spacing:.2em;color:#8fc4ff;font-weight:800}h1{font-size:clamp(26px,5vw,42px);margin:12px 0 8px}.lead{color:#afc1db;line-height:1.7;max-width:760px}.home{border:1px solid #607491;border-radius:12px;padding:11px 16px;text-decoration:none;font-weight:700}.panel{margin:25px 0;display:grid;grid-template-columns:minmax(200px,2fr) 1fr 1fr;gap:10px}.panel input,.panel select{width:100%;background:#19263b;border:1px solid #455d7a;color:white;border-radius:13px;padding:14px;font-size:16px}.summary{color:#bdd3ef;margin:10px 0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}.card{background:#16243a;border:1px solid #324866;border-radius:18px;padding:18px;display:flex;flex-direction:column;min-height:200px}.emoji{font-size:36px}.card h2{font-size:18px;margin:12px 0 5px;line-height:1.45}.meta{color:#90c5f8;font-size:12px}.desc{color:#b8c7d9;font-size:13px;line-height:1.7;flex:1}.play{display:inline-flex;justify-content:center;background:#74c9f4;color:#0a1c31;text-decoration:none;border-radius:10px;padding:11px 13px;font-weight:800;margin-top:14px}.play.disabled{background:#36485e;color:#aebac8;pointer-events:none}.note{font-size:12px;color:#9eb4cc;margin:20px 0;line-height:1.7}.empty{padding:32px;border:1px dashed #667c99;border-radius:14px;color:#c3d4e8}.hidden{display:none!important}@media(max-width:660px){.panel{grid-template-columns:1fr}main{padding-top:22px}.grid{grid-template-columns:1fr 1fr;gap:9px}.card{padding:12px;min-height:190px}.card h2{font-size:15px}.desc{font-size:12px}.home{font-size:12px}}@media(max-width:410px){.grid{grid-template-columns:1fr}}
</style></head><body><main>
<header><div class="brand">DISCOVERY / GAME BANK</div><a class="home" href="/">GAME BANK トップへ</a></header>
<h1>ゲーム・アプリ一覧</h1><p class="lead">ゲームを名前・ジャンルで検索。登録データから自動生成する一覧です。未完成・非公開のものも状態を分けて確認できます。</p>
<section class="panel" aria-label="絞り込み"><input id="q" type="search" placeholder="ゲーム名・説明から検索" aria-label="検索"><select id="category" aria-label="カテゴリ"><option value="">全カテゴリ</option></select><select id="status" aria-label="表示状態"><option value="all">全件</option><option value="visible">掲載対象</option><option value="hidden">非掲載・未公開</option></select></section>
<div id="summary" class="summary" role="status" aria-live="polite">データを読み込み中…</div><div id="cards" class="grid"></div>
<p class="note">※「公開」等の表記は元の登録台帳に基づきます。URLの稼働・iPhone実機動作・決済機能はこの画面では保証しません。公開URLがない項目にはリンクを表示しません。</p>
</main><script>
(()=>{'use strict';const $=id=>document.getElementById(id), q=$('q'),category=$('category'),status=$('status'),cards=$('cards'),summary=$('summary');let data=[];
const norm=s=>String(s??'').normalize('NFKC').toLocaleLowerCase('ja');
const text=(tag,content,cls)=>{const el=document.createElement(tag);el.textContent=String(content??'');if(cls)el.className=cls;return el};
const safePath=u=>{if(typeof u!=='string'||!u.startsWith('/')||u.startsWith('//')||/[\\\x00-\x1f]/.test(u))return null;try{const p=new URL(u,location.origin);return p.origin===location.origin?p.pathname+p.search:null}catch{return null}};
function render(){const needle=norm(q.value.trim()),cat=category.value,mode=status.value;const rows=data.filter(g=>{const visible=g.listed!==false&&g.hidden!==true;return(!needle||norm([g.title,g.description,g.category,g.genre].join(' ')).includes(needle))&&(!cat||(g.category||g.genre||'その他')===cat)&&(mode==='all'||(mode==='visible'?visible:!visible))});summary.textContent=rows.length+'件表示 / 登録'+data.length+'件（掲載・公開は台帳記録に基づく）';cards.replaceChildren();if(!rows.length){cards.append(text('p','該当するゲームはありません。','empty'));return}const frag=document.createDocumentFragment();for(const g of rows){const card=text('article','','card');card.append(text('div',g.emoji||'🎮','emoji'));const visible=g.listed!==false&&g.hidden!==true;card.append(text('div',(g.category||g.genre||'その他')+' · '+(visible?'掲載対象':'非掲載・未公開')+' · '+(g.status||'状態未確認'),'meta'));card.append(text('h2',g.title||'名称未登録'));card.append(text('p',g.description||'概要未登録','desc'));const url=safePath(g.url);if(url){const a=text('a','ゲームページを開く','play');a.href=url;a.rel='noopener';card.append(a)}else{card.append(text('span','URL未登録','play disabled'))}frag.append(card)}cards.append(frag)}
async function load(){try{const response=await fetch('/data/games.json',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const json=await response.json();if(!Array.isArray(json))throw Error('台帳形式が不正');data=json.filter(x=>x&&typeof x==='object');const cats=[...new Set(data.map(g=>g.category||g.genre||'その他'))].sort((a,b)=>a.localeCompare(b,'ja'));for(const c of cats){const opt=document.createElement('option');opt.value=c;opt.textContent=c;category.append(opt)}render()}catch(e){summary.textContent='台帳の読み込みに失敗しました';cards.replaceChildren(text('div','/data/games.json を取得できません。公開環境とビルド設定を確認してください。','empty'));console.error(e)}}
[q,category,status].forEach(el=>el.addEventListener(el===q?'input':'change',render));load();
})();
</script></body></html>
