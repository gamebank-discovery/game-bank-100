  function aiChoice(hand,energy){const choices=[];for(const card of hand){if(card.cost>energy)continue;for(let i=0;i<3;i++){if(!canPlace('ai',card,i))continue;const diff=score(i,'player')-score(i,'ai'),mine=state.lanes[i].ai.length,opp=state.lanes[i].player.length;let value=card.faction==='spell'?3:card.power+((card.faction===LANES[i].faction)?2:0);if(card.ability==='draw')value=state.round<=4?7.2:2.0;if(card.ability==='buffall')value=3*mine;if(card.ability==='buffglobal')value=2*state.lanes.reduce((n,l)=>n+l.ai.length,0);if(card.ability==='weaken')value=6;if(card.ability==='freeze')value=3*Math.min(2,opp);if(card.ability==='solar'&&i===0)value+=2;if(card.ability==='sun'&&i===0)value+=3;if(card.ability==='companion'&&mine>=1)value+=2;if(card.ability==='crowd'&&opp>=2)value+=3;if(card.ability==='early'&&state.round<=3)value+=3;if(card.ability==='solo'&&mine===0)value+=4;if(card.ability==='nebula')value+=2*state.lanes[i].ai.filter(x=>C[x.id].faction==='nebula').length;if(card.ability==='lunar')value+=2*state.lanes[i].ai.filter(x=>C[x.id].faction==='lunar').length;if(card.ability==='first'&&mine===0)value+=2;if(card.ability==='enemy3'&&opp>=3)value+=4;if(card.ability==='ally2'&&mine>=2)value+=3;if(card.ability==='team')value+=mine;if(card.ability==='adjacent'&&((i>0&&state.lanes[i-1].ai.length)||(i<2&&state.lanes[i+1].ai.length)))value+=3;

  function hideModal(){dom.overlay.hidden=true}
  function welcome(){scene='welcome';const s=stats;showModal(`<div class="modal-ornament">✦</div><div class="eyebrow">DISCOVERY ORIGINAL CARD GAME</div><h2 id="modalTitle">GALAXY DECK</h2><div style="color:#e9dbfd;letter-spacing:.1em;font-weight:800">ギャラクシーデッキ</div><div class="intro-globes"><span>☀️</span><span>🪐</span><span>🌌</span></div><p class="lead">星々を召喚し、3つの星域を奪い合え。<br>特殊能力と読み合いでAIを打ち破ろう！</p><div class="rule-table"><div class="rule-row"><span class="rule-icon">①</span><div>カードを選んで好きな星域に配置する</div></div><div class="rule-row"><span class="rule-icon">②</span><div>エネルギーの範囲内で何枚でも使える</div></div><div class="rule-row"><span class="rule-icon">③</span><div>6ラウンド後、<b>より多くの星域</b>を制すれば勝利（同数なら合計パワーで判定）</div></div></div><div class="modal-actions"><button class="primary-btn" id="startGameBtn">✦ ゲーム開始</button><button class="subtle-btn" id="introRulesBtn">詳しい遊び方</button></div><p class="stats">戦績　<b>${s.wins}</b> 勝 / ${s.losses} 敗　 ·　 最高連勝 <b>${s.best}</b></p>`);document.getElementById('startGameBtn').addEventListener('click',initGame);document.getElementById('introRulesBtn').addEventListener('click',()=>rules(true))}
  function rules(fromWelcome=false){showModal(`<div class="modal-ornament">☾</div><h2 id="modalTitle" style="font-size:25px">遊び方</h2><div class="rule-table"><div class="rule-row"><span class="rule-icon">🃏</span><div><b>カードの使い方</b><br>手札をタップして選び、3つの星域のどれかをタップ。PCならドラッグ＆ドロップもOK。各星域には両陣営最大4枚ずつ置けます。</div></div><div class="rule-row"><span class="rule-icon">⚡</span><div><b>エネルギー</b><br>毎ターン決められた量が使えます。2 → 3 → 4 → 5 → 6 → 7 と増加し、余りは次に持ち越せません。</div></div><div class="rule-row"><span class="rule-icon">✨</span><div><b>属性ボーナス</b><br>太陽（☀）・月（☾）・星雲（✦）のカードは、同じ属性の星域に置くとパワー +2。カード固有の能力も自動発動します。</div></div><div class="rule-row"><span class="rule-icon">🪄</span><div><b>スペルカード</b><br>味方の強化や敵の弱体化ができます。強化する味方や弱体化する敵がいない星域では使用できません。ワームホールは例外。</div></div><div class="rule-row"><span class="rule-icon">🏆</span><div><b>勝利条件</b><br>6ラウンド終了時に、より多くの星域で相手を上回ると勝ち。支配星域数が同じなら、全星域の合計パワーが高い側が勝ちです。</div></div></div><div class="modal-actions"><button class="primary-btn" id="ruleBack">${fromWelcome?'はじめる ✦':'ゲームに戻る'}</button></div><p class="notice">通信・課金・個人情報登録なし。戦績だけ端末内に保存します。</p>`);document.getElementById('ruleBack').addEventListener('click',()=>fromWelcome?initGame():hideModal())}
  function showResult(w){const title=w.result==='win'?'VICTORY!':w.result==='lose'?'DEFEAT':'DRAW';const jp=w.result==='win'?'銀河を制した！':w.result==='lose'?'星域を奪われた…':'互角の宇宙戦';let detail=LANES.map((lane,i)=>{let a=score(i,'ai'),p=score(i,'player');return `<div><small>${lane.icon} ${lane.name}</small><b class="${p>a?'mini-score-win':p<a?'mini-score-lose':''}">${p} : ${a}</b><small>あなた : AI</small></div>`}).join('');showModal(`<div class="modal-ornament">${w.result==='win'?'🏆':w.result==='lose'?'☄':'✧'}</div><div class="eyebrow">GALAXY BATTLE COMPLETE</div><h2 id="modalTitle">${title}</h2><p class="lead">${jp}<br>あなたが支配した星域 <b>${w.p}</b> / AI <b>${w.a}</b></p><div class="result-detail">${detail}</div><p class="result-line">合計パワー <b>${w.totalP}</b> — <b>${w.totalA}</b><br>${w.result==='win'?'新たな銀河の伝説が生まれた ✧':w.result==='lose'?'編成を変えて、もう一度挑戦しよう。':'次は決着をつけよう！'}</p><div class="modal-actions"><button class="primary-btn" id="againBtn">↻ もう一度対戦</button><button class="subtle-btn" id="returnTitleBtn">タイトルへ</button></div><p class="stats">通算 <b>${stats.wins}</b> 勝 / ${stats.losses} 敗 / ${stats.draws} 分　 ·　 最高連勝 <b>${stats.best}</b></p>`);document.getElementById('againBtn').addEventListener('click',initGame);document.getElementById('returnTitleBtn').addEventListener('click',welcome)}
  document.getElementById('endBtn').addEventListener('click',endTurn);document.getElementById('rulesBtn').addEventListener('click',()=>rules(!state||scene==='welcome'));document.getElementById('restartBtn').addEventListener('click',()=>{if(state&&!state.ended&&!dom.overlay.hidden){welcome();return}if(state&&!state.ended&&!confirm('現在の対戦をやり直しますか？'))return;initGame()});dom.sound.addEventListener('click',()=>{soundOn=!soundOn;dom.sound.textContent=soundOn?'🔊':'🔇';try{localStorage.setItem(soundKey,soundOn?'on':'off')}catch{}if(soundOn)playTone(680,.1)});
  window.GALAXY_DECK_DEBUG={getState:()=>state,score,winners,initGame,play,card:C};
  welcome();
  if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
})();
</script>
</body>
</html>
