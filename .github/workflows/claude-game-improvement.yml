# Claude Code on GAME BANK, launched by an owner's @claude issue comment.
# One-time prerequisites (performed by repository owner):
# - Install Claude GitHub App: https://github.com/apps/claude
# - Set GitHub Actions secret CLAUDE_CODE_OAUTH_TOKEN using Claude Code subscription
#   (generate locally with `claude setup-token`). Never commit or paste tokens into issues.
# - Merge this workflow to the default branch only after owner reviews it.
# An issue comment on the default branch after setup starts the job; old
# comments do not replay automatically. This workflow does not deploy production.
name: Claude GAME BANK quality improvement
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  claude:
    if: >-
      github.event.issue.number == 5 &&
      contains(github.event.comment.body, '@claude') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - name: Checkout repository (reviewed version)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify subscription secret exists
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Missing CLAUDE_CODE_OAUTH_TOKEN GitHub secret. Claude paid-plan sign-in alone does not populate this secret."
            exit 1
          fi
      - name: Claude Code — implement request as reviewable changes
        uses: anthropics/claude-code-action@4845bacbb38b3c4b15d948f035349786f678e068 # v1 pinned 2026-11-04
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          claude_args: "--max-turns 30"
