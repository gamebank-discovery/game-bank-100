name: Audit Vercel snapshot for safe Cloudflare merge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout GAME BANK safely
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Snapshot Vercel into a staging directory only
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/mirror_site.py \
            --origin https://game-bank-100.vercel.app \
            --dest "$RUNNER_TEMP/vercel-archive" \
            --max-files 4000 \
            --max-total-mb 200
          test -s "$RUNNER_TEMP/vercel-archive/index.html"
          test -s "$RUNNER_TEMP/vercel-archive/migration-report.json"
      - name: Merge only missing static files into an isolated preview
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/merge_vercel_snapshot.py \
            --existing public-mirror \
            --incoming "$RUNNER_TEMP/vercel-archive" \
            --output "$RUNNER_TEMP/gamebank-merged-preview" \
            --report "$RUNNER_TEMP/merge-audit.json"
          python3 scripts/check_catalog_integrity.py public-mirror
          python3 scripts/check_catalog_integrity.py "$RUNNER_TEMP/gamebank-merged-preview"
      - name: Upload preview and conflict report for review
        uses: actions/upload-artifact@v4
        with:
          name: gamebank-vercel-cloudflare-merge-audit
          path: |
            ${{ runner.temp }}/merge-audit.json
            ${{ runner.temp }}/gamebank-merged-preview
          if-no-files-found: error
          retention-days: 14
