name: Recover public GAME BANK site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/mirror_site.py"
      - ".github/workflows/mirror-public-site.yml"

permissions:
  contents: write

concurrency:
  group: public-gamebank-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Mirror public static files from existing GAME BANK site
        run: |
          python3 --version
          python3 -m py_compile scripts/mirror_site.py
          python3 scripts/mirror_site.py \
            --origin https://game-bank-100.vercel.app \
            --dest public-mirror \
            --max-files 4000 \
            --max-total-mb 200
      - name: Ensure recovery actually found a homepage
        run: |
          test -s public-mirror/index.html
          test -s public-mirror/migration-report.json
      - name: Commit recovered static snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-mirror
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: recover publicly served GAME BANK assets from Vercel"
            git push origin HEAD:main
          fi
