name: Verify KEIBA EDGE PRO v7

on:
  pull_request:
    branches: [main]
    paths:
      - 'public-mirror/games/keiba-edge-pro/**'
      - 'tests/verify_keiba_v7.cjs'
      - '.github/workflows/verify-keiba-v7.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify scripts and advisor
        run: node tests/verify_keiba_v7.cjs
      - name: Validate Cloudflare static build includes race game
        run: |
          python3 scripts/build_cloudflare.py
          test -s dist/games/keiba-edge-pro/index.html
          grep -q 'KEIBA EDGE PRO 7' dist/games/keiba-edge-pro/index.html
