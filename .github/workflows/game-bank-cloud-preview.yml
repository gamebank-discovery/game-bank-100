name: GAME BANK CLOUD preview
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-bank-cloud-preview
  cancel-in-progress: false

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build existing games
        run: python3 scripts/build_cloudflare.py
      - name: Verify migrated game assets
        run: |
          test -s dist/index.html
          test -s dist/games/pig-jump-evolution/index.html
          test -s dist/games/pig-jump-evolution/pig.js
          grep -q 'memory-arcade-v5' dist/games/pig-jump-evolution/index.html
      - name: Require Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" && test -n "$CF_ACCOUNT" || {
            echo 'Cloudflare secrets missing; legacy production was not touched.'
            exit 1
          }
      - name: Deploy isolated preview Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --config cloud/game-bank-cloud/wrangler.jsonc
