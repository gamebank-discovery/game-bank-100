name: Materialize PIG LOVE STORY for Cloudflare Pages
on:
  push:
    branches: [main]
    paths:
      - 'pig-source/pig-love-v2.part*.b64'
      - 'scripts/restore_pig_love.py'
      - '.github/workflows/publish-pig-love.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pig-love-cloudflare-release
  cancel-in-progress: false

jobs:
  publish-game:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Restore independent static game
        run: |
          set -euo pipefail
          python3 scripts/restore_pig_love.py
          node --check public-mirror/games/pig-jump-evolution/pig.js
          node --check public-mirror/games/pig-jump-evolution/engine.js
          grep -q 'loveplay-cloudflare-v2' public-mirror/games/pig-jump-evolution/index.html
      - name: Commit game assets for Git-connected Pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-mirror/games/pig-jump-evolution/index.html public-mirror/games/pig-jump-evolution/engine.js public-mirror/games/pig-jump-evolution/pig.js
          if git diff --cached --quiet; then
            echo "Already up to date"
          else
            git commit -m "feat: publish PIG LOVE STORY standalone static assets"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
