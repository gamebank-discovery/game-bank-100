name: Sync LOOK MATCH Rakuten product URLs
on:
  workflow_dispatch:
  schedule:
    - cron: '23 0 * * *'
permissions:
  contents: write
concurrency:
  group: look-match-rakuten-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official API item affiliate URLs
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python3 scripts/sync_lookmatch_rakuten.py
      - name: Commit only changed catalog
        run: |
          if [ -n "$(git status --porcelain -- public-mirror/games/look-match/rakuten-items.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public-mirror/games/look-match/rakuten-items.json
            git commit -m "chore: sync LOOK MATCH Rakuten links"
            git push
          fi
