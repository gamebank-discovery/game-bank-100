name: Publish PIG JUMP on Cloudflare Pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pig-cloudflare.yml'
      - 'scripts/patch_pig_fun.py'
      - 'scripts/patch_pig_memory_arcade.py'
      - 'scripts/patch_pig_course.py'
      - 'scripts/build_cloudflare.py'
      - 'scripts/restore_pig_love.py'
      - 'public-mirror/**'
  workflow_dispatch:
  schedule:
    - cron: '27 */6 * * *'
permissions:
  contents: read
concurrency:
  group: gamebank-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check scheduled authentication readiness
        id: credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && { [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; }; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials not linked yet; scheduled publish skipped without wasting a build."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and validate pig game
        if: steps.credentials.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/build_cloudflare.py scripts/patch_pig_course.py scripts/patch_pig_fun.py scripts/patch_pig_memory_arcade.py
          python3 scripts/build_cloudflare.py
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          Path('dist/gamebank-release.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'game':'pig-jump','version':'memory-arcade-v5'}))
          PY
          node --check dist/games/pig-jump-evolution/pig.js
          node --check dist/games/pig-jump-evolution/engine.js
          python3 - <<'PY'
          from pathlib import Path
          js=Path('dist/games/pig-jump-evolution/pig.js').read_text()
          for marker in ('__PIG_LOVE_PLAY_V2__','__PIG_COURSE_GOAL_V3__','__PIG_ARCADE_FUN_V1__','__PIG_MEMORY_ARCADE_V5__','COURSE_MAX=1000'):
              assert marker in js,marker
          assert Path('dist/index.html').is_file()
          print('PASS: PIG JUMP + LOVE + 5 worlds + memory arcade')
          PY
      - name: Upload Cloudflare ready GAME BANK build
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gamebank-pig-cloudflare-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Find the already configured Cloudflare Pages project
        if: steps.credentials.outputs.ready == 'true'
        id: target
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREFERRED_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub Secrets CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID; upload not attempted."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 2 \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects?per_page=100" > /tmp/cf-projects.json
          python3 - <<'PY'
          import json,os
          data=json.load(open('/tmp/cf-projects.json'))
          if not data.get('success'):raise SystemExit('Cloudflare Pages API request failed')
          projects=data.get('result') or []
          preferred=os.environ.get('PREFERRED_PROJECT','').strip()
          if preferred:
              found=[p for p in projects if p.get('name')==preferred]
          else:
              linked=[p for p in projects if ((p.get('source') or {}).get('config') or {}).get('repo_name')=='game-bank-100']
              if len(linked)==1:found=linked
              else:
                  expected={'game-bank-100next','game-bank-100','game-bank-100-next','gamebank-discovery','pig-jump-evolution'}
                  found=[p for p in projects if p.get('name','').lower() in expected]
          if len(found)!=1:
              raise SystemExit('Could not safely choose exactly one existing GAME BANK Pages project; set repo variable CLOUDFLARE_PAGES_PROJECT to the exact name')
          project=found[0]['name']
          print('Selected existing Pages project:',project)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('project='+project+'\n')
          PY
      - name: Check already published GAME BANK commit
        id: published
        if: steps.credentials.outputs.ready == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ steps.target.outputs.project }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" > /tmp/cf-current-project.json
          SUBDOMAIN=$(python3 - <<'PY'
          import json
          p=json.load(open('/tmp/cf-current-project.json'))['result']
          print(p.get('subdomain') or (p['name']+'.pages.dev'))
          PY
          )
          SUBDOMAIN=$(printf '%s' "$SUBDOMAIN" | sed 's|^https://||;s|/$||')
          if curl --fail --location --silent --show-error --max-time 20 \
            "https://$SUBDOMAIN/gamebank-release.json?check=$GITHUB_SHA" -o /tmp/cf-live-release.json \
            && python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/cf-live-release.json'))
          assert d.get('commit')==os.environ['GITHUB_SHA']
          PY
          then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "Same commit is already public. Skipping unnecessary Cloudflare deployment."
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "New commit not yet public. Publishing."
          fi
      - name: Deploy to Cloudflare Pages (production)
        if: steps.credentials.outputs.ready == 'true' && steps.published.outputs.current != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ steps.target.outputs.project }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist \
            --project-name "$PAGES_PROJECT" \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "PIG JUMP memory arcade v5" | tee /tmp/pages-deploy.log
      - name: Verify public game files
        if: steps.credentials.outputs.ready == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ steps.target.outputs.project }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" > /tmp/cf-deployed-project.json
          SUBDOMAIN=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/cf-deployed-project.json'))['result']
          print(d.get('subdomain') or (d['name']+'.pages.dev'))
          PY
          )
          SUBDOMAIN=$(printf '%s' "$SUBDOMAIN" | sed 's|^https://||;s|/$||')
          echo "Checking Cloudflare at $SUBDOMAIN"
          TEST_URL="https://$SUBDOMAIN/games/pig-jump-evolution/pig.js?sha=$GITHUB_SHA"
          RELEASE_URL="https://$SUBDOMAIN/gamebank-release.json?sha=$GITHUB_SHA"
          for attempt in $(seq 1 10); do
            if curl --fail --location --silent --show-error --max-time 20 "$TEST_URL" -o /tmp/cloudflare-live-pig.js \
              && grep -q '__PIG_MEMORY_ARCADE_V5__' /tmp/cloudflare-live-pig.js \
              && grep -q 'COURSE_MAX=1000' /tmp/cloudflare-live-pig.js \
              && curl --fail --silent --show-error --max-time 20 "$RELEASE_URL" -o /tmp/live-release.json \
              && python3 - <<'PY'
          import json,os
          assert json.load(open('/tmp/live-release.json'))['commit']==os.environ['GITHUB_SHA']
          PY
          then
              echo "Verified LIVE URL https://$SUBDOMAIN/games/pig-jump-evolution/"
              echo "### Cloudflare PIG JUMP published" >> "$GITHUB_STEP_SUMMARY"
              echo "https://$SUBDOMAIN/games/pig-jump-evolution/" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Cloudflare upload completed but live JS with both gameplay markers was not verified."
          exit 1
