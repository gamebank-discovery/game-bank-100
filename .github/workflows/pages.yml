name: Publish GAME BANK preview (GitHub Pages)
on:
  push:
    branches: [main]
    paths:
      - 'public-mirror/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare the GitHub Pages preview without rewriting the Cloudflare site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -a public-mirror/. _site/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="theme-color" content="#0a1d17"><title>GAME BANK｜新作プレイ</title>
          <style>*,*:before,*:after{box-sizing:border-box}body{background:#071510;color:#f2f3ea;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:800px;margin:auto;padding:28px 20px}.brand{color:#e3c687;font-weight:800;letter-spacing:.16em}.hero{border:1px solid #937948;border-radius:18px;padding:32px 24px;margin-top:22px;background:linear-gradient(145deg,#153d2b,#091914)}h1{font-size:clamp(34px,8vw,60px);line-height:1.15}p{line-height:1.8;color:#c6d4c9}a{color:#eacb86}.button{display:inline-block;background:#eacb86;color:#19271c;border-radius:999px;padding:14px 20px;text-decoration:none;font-weight:800;margin-top:12px}.small{font-size:13px;color:#9eb1a6}</style>
          </head><body><main class="wrap"><p class="brand">🎮 GAME BANK / DISCOVERY</p><h1>KEIBA EDGE PRO</h1><p>競馬新聞風予想 × 愛馬育成 × レースゲーム</p><div class="hero"><h2>🏇 新作 v4 をプレイ</h2><p>競馬新聞風UI・レースゲーム・予想クイズ・GⅠ結果検証を楽しもう。独自予想の的中率は未検証です。</p><a class="button" href="./games/keiba-edge-pro/index.html">KEIBA EDGE PRO をプレイ</a></div><p>旧GAME BANKのすべてのゲームは <a href="https://game-bank-100.vercel.app/">従来の本番サイト</a> にあります。</p><p class="small">これは移行期間中のプレビューです。Cloudflare本番サイトにはまだ切り替わっていません。</p></main></body></html>
          HTML
          touch _site/.nojekyll
      - name: Upload static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
