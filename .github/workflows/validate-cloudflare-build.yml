name: Validate Cloudflare GAME BANK build

on:
  push:
    branches: [main]
    paths:
      - 'public-mirror/**'
      - 'scripts/**'
      - 'monetization/**'
      - '.github/workflows/validate-cloudflare-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build Cloudflare Pages static output
        run: python3 scripts/build_cloudflare.py --source public-mirror --output dist
      - name: Verify existing GAME BANK catalog and LOST QUEST
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          output=Path('dist')
          html=(output/'index.html').read_text(encoding='utf-8')
          games=json.loads((output/'data/games.json').read_text(encoding='utf-8'))
          assert len(games)>=164, f'Catalog unexpectedly incomplete: {len(games)}'
          assert len({str(g.get('id')) for g in games})==len(games), 'Duplicate game IDs'
          lost=[g for g in games if g.get('id')==164 and g.get('url')=='/games/lost-quest/index.html']
          assert len(lost)==1 and lost[0].get('listed') and lost[0].get('playable'), 'LOST QUEST missing or hidden from catalog'
          assert html.count('data-game-id="164"')==1, 'LOST QUEST homepage card missing or duplicated'
          assert html.count('href="/games/lost-quest/index.html"')==1, 'LOST QUEST link missing or duplicated'
          app=(output/'games/lost-quest/index.html').read_text(encoding='utf-8')
          assert len(app)>40000 and 'LOST QUEST' in app and 'function qrSVG' in app, 'LOST QUEST demo truncated'
          # Keep all previously bundled content, including KEIBA EDGE PRO,
          # without assuming another game controls ID 163 or the first catalog slot.
          horse=(output/'games/keiba-edge-pro/index.html').read_text(encoding='utf-8')
          assert 'KEIBA EDGE PRO' in horse and 'ダービー物語' in horse and len(horse)>100000
          assert (output/'games/keiba-edge-pro/cover.svg').stat().st_size>100
          print('PASS:',len(games),'catalog entries, LOST QUEST card+demo and existing horse game bundled')
          PY
